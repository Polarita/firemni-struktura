# =============================================================================
# metadata-schema-kernel · declarative schema DRAFT / deklarativní schéma NÁVRH
# Module / Modul: pujcovna-meridel · Blok 16 · balíček S4 · Verze 3.20
# EN: B2B rental of measuring instruments and temporary power sources as an
#     extension of the collision-free resource calendar in
#     centralni-lhutnik-a-objekty. Nothing here is deployed (greenfield design).
# CZ: B2B půjčovna měřidel a dočasných zdrojů jako rozšíření bezkolizního
#     kalendáře zdrojů v centralni-lhutnik-a-objekty. Nic z toho není nasazeno
#     (greenfield návrh).
# EN: No prices here. The price list is a PROPOSAL to be approved by 1001.
# CZ: Žádné ceny. Ceník je NÁVRH — ke schválení 1001.
# EN: The exact DSL of metadata-schema-kernel is fixed by 17001 during
#     implementation; this file is a design input, not a tested migration.
# CZ: Přesný formát (DSL) metadata-schema-kernel určí 17001 při implementaci;
#     tento soubor je návrhový podklad, ne otestovaná migrace.
# =============================================================================

schema:
  name: pujcovna_meridel
  module: pujcovna-meridel
  package: S4
  block: 16
  release: Polarita-3.20
  schema_version: 0.1.0-draft
  status: DRAFT                 # EN: proposal only / CZ: pouze návrh
  owner_ai: 17001               # EN: 17001 programator / CZ: 17001 programator
  operator_ai: 14005            # EN: 14005 zakazky runs the calendar / CZ: 14005 zakazky vede kalendář
  finance_ai: 16001             # EN: 16001 ucetni, billing drafts / CZ: 16001 ucetni, návrhy fakturace
  judges: [15001, 17004]        # EN: terms and security review / CZ: kontrola podmínek a bezpečnosti
  approver_person_no: 1001      # EN: human approval in Decisions / CZ: lidské schválení v Decisions

storage:
  rental:
    database: db_erp_lhutnik
    schema: pujcovna
  # EN: Shared resource calendar. Same database, no new one. The table belongs to
  #     centralni-lhutnik-a-objekty (Blok 8); the schema name is a PROPOSAL. If Blok 8
  #     already created its calendar table, it is extended by a migration to the
  #     columns and constraints below — a second calendar table is never created.
  # CZ: Sdílený kalendář zdrojů. Stejná databáze, žádná nová. Tabulka patří modulu
  #     centralni-lhutnik-a-objekty (Blok 8); název schématu je NÁVRH — ke schválení 1001.
  #     Pokud Blok 8 tabulku kalendáře už založil, rozšíří se migrací o sloupce
  #     a omezení níže — druhá tabulka kalendáře se nikdy nezakládá.
  shared_calendar:
    database: db_erp_lhutnik
    schema: kalendar_zdroju

conventions:
  optimistic_locking: version_etag
  audit_columns: [created_at, created_by_person_no, updated_at, version]
  pii_allowed: false            # EN: contact persons live outside this schema / CZ: kontaktní osoby žijí mimo toto schéma
  cross_database_links: api_only
  secrets: openbao_only
  mutations_by_ai: draft_only   # EN: ai prepares DRAFT, 1001 confirms / CZ: ai připraví DRAFT, 1001 potvrzuje
  money: decimal_only           # EN: exact decimals, never floats / CZ: přesná desetinná čísla, nikdy float

types:
  case_id:
    base: string
    pattern: '^POL-[0-9]{4}-[0-9]{5}$'    # EN: file number / CZ: číslo spisu POL-RRRR-NNNNN
  person_no:
    base: integer
    min: 1001                   # EN: living natural persons only / CZ: výhradně živé fyzické osoby
    max: 9999
  org_code:
    base: string
    pattern: '^ORG-[A-Z0-9-]+$' # EN: legal entity code / CZ: kód právnické osoby
  warehouse_code:
    base: string
    pattern: '^MAIN-[1-9][0-9]{2}$'
  object_key:
    base: string                # EN: Garage (S3) object key / CZ: klíč objektu v Garage (S3)
  currency:
    base: string
    pattern: '^[A-Z]{3}$'       # EN: three-letter currency code / CZ: třípísmenný kód měny

enums:
  asset_category:
    - NETWORK_ANALYZER          # EN: power quality / network analyzer / CZ: analyzátor sítí
    - THERMAL_CAMERA            # EN: thermal imaging camera / CZ: termokamera
    - EV_CHARGER_TESTER         # EN: EV charger tester / CZ: tester EV nabíječek
    - MOBILE_SITE_SWITCHBOARD   # EN: mobile construction-site switchboard / CZ: mobilní staveništní rozváděč
    - GENERATOR                 # EN: generator set / CZ: elektrocentrála
    - OTHER                     # EN: other, approved by 1001 / CZ: jiné, schvaluje 1001
  # EN: What Lhutnik must hold as valid before an asset may leave the store.
  # CZ: Co musí Lhůtník evidovat jako platné, než zdroj opustí sklad.
  compliance_kind:
    - CALIBRATION               # EN: calibration of an instrument / CZ: kalibrace měřidla
    - PERIODIC_INSPECTION       # EN: inspection of a source or switchboard / CZ: revize / kontrola zdroje či rozváděče
  asset_status:
    - IN_STOCK                  # EN: in warehouse, usable / CZ: na skladě, použitelné
    - OUT_INTERNAL              # EN: on an internal job / CZ: na interním výjezdu
    - OUT_RENTAL                # EN: handed over to a renter / CZ: předáno nájemci
    - RETURN_INSPECTION         # EN: returned, being checked / CZ: vráceno, probíhá kontrola
    - IN_SERVICE                # EN: repair or calibration / CZ: oprava nebo kalibrace
    - BLOCKED                   # EN: compliance expired / CZ: propadlá kalibrace či revize
    - RETIRED                   # EN: removed from use / CZ: vyřazeno
  renter_type:
    - CERTIFIED_PARTNER_SUB     # EN: verified partner subcontractor / CZ: prověřený partner Certified Partner SUB
    - B2B_CUSTOMER              # EN: business customer / CZ: B2B zákazník
  renter_status: [PENDING_VERIFICATION, APPROVED, SUSPENDED, REJECTED]
  price_list_status:
    - DRAFT_PROPOSAL            # EN: PROPOSAL, not usable for confirmation / CZ: NÁVRH, nelze podle něj potvrzovat
    - APPROVED                  # EN: approved by 1001 / CZ: schváleno 1001
    - RETIRED                   # EN: no longer valid / CZ: již neplatí
  reservation_status:
    - DRAFT                     # EN: being prepared / CZ: rozpracováno
    - REQUESTED                 # EN: sent for confirmation / CZ: odesláno k potvrzení
    - CONFIRMED                 # EN: confirmed by 1001 / CZ: potvrzeno 1001
    - HANDED_OVER               # EN: asset is with the renter / CZ: zdroj je u nájemce
    - OVERDUE                   # EN: planned return passed, asset still with the renter / CZ: plánované vrácení uplynulo, zdroj je stále u nájemce
    - RETURNED                  # EN: asset is back, not settled yet / CZ: zdroj vrácen, zatím nevyúčtováno
    - NOT_RETURNED              # EN: asset lost or not returned, not settled yet / CZ: zdroj ztracen nebo nevrácen, zatím nevyúčtováno
    - CLOSED                    # EN: settled and invoiced / CZ: vyúčtováno a vyfakturováno
    - REJECTED                  # EN: refused / CZ: zamítnuto
    - PREEMPTED                 # EN: slot taken by an internal revision trip / CZ: termín obsadil interní revizní výjezd
    - CANCELLED                 # EN: cancelled / CZ: zrušeno
  # EN: WAIVED = no deposit is collected (zero deposit in the approved price list or a
  #     waiver by 1001 in Decisions); there is nothing to settle afterwards.
  # CZ: WAIVED = kauce se nevybírá (nulová kauce ve schváleném ceníku nebo prominutí
  #     rozhodnutím 1001 v Decisions); po vrácení pak není co vypořádat.
  deposit_status: [NOT_SET, REQUESTED, RECEIVED, WAIVED, SETTLED]
  deposit_kind: [REQUESTED, RECEIVED, REFUNDED, WITHHELD]
  protocol_direction:
    - HANDOVER                  # EN: handover to the renter / CZ: předání nájemci
    - RETURN                    # EN: return to Polarita / CZ: vrácení Polaritě
  protocol_status: [DRAFT, SIGNED, SEALED, SUPERSEDED, DISCARDED]
  condition_grade:
    - OK                        # EN: without defects / CZ: bez závad
    - WEAR                      # EN: normal wear / CZ: běžné opotřebení
    - DAMAGED                   # EN: damaged / CZ: poškozeno
    - INCOMPLETE                # EN: accessories missing / CZ: chybí příslušenství
    - NOT_WORKING               # EN: not working / CZ: nefunkční
  damage_status: [OPEN, ESTIMATED, APPROVED, SETTLED, DISMISSED]
  invoice_request_status: [DRAFT, IN_DECISIONS, APPROVED, HANDED_TO_FINANCE]
  booking_kind:
    - INTERNAL_REVISION         # EN: internal revision trip (has priority) / CZ: interní revizní výjezd (má přednost)
    - INTERNAL_JOB              # EN: other internal job / CZ: jiný interní výjezd
    - RENTAL                    # EN: rental reservation / CZ: půjčovní rezervace
    - SERVICE                   # EN: repair or calibration window / CZ: okno opravy nebo kalibrace
  booking_status:
    - HELD                      # EN: slot held, not confirmed yet / CZ: termín držen, zatím nepotvrzen
    - CONFIRMED                 # EN: slot confirmed / CZ: termín potvrzen
    - RELEASED                  # EN: slot freed / CZ: termín uvolněn

# EN: Every state machine lists its terminal states (no outgoing transition);
#     every other state must have at least one way out.
# CZ: Každý stavový automat vyjmenovává koncové stavy (bez odchozího přechodu);
#     každý jiný stav musí mít aspoň jeden výstup.

entities:

  # ---------------------------------------------------------------------------
  # EN: One row per booking of one asset for one period — internal trips, rentals
  #     and service windows together. The no-overlap rule lives ONLY here, as a
  #     database exclusion constraint, so no module can bypass it.
  # CZ: Jeden řádek na rezervaci jednoho zdroje na jedno období — interní výjezdy,
  #     výpůjčky i servisní okna dohromady. Pravidlo bez překryvu žije JEN zde jako
  #     databázové vylučovací omezení, takže je žádný modul neobejde.
  # ---------------------------------------------------------------------------
  resource_booking:
    storage: shared_calendar
    table: resource_booking
    fields:
      id: {type: uuid, primary_key: true}
      # EN: Same asset identifier for internal and rental use (master record in Lhutnik).
      # CZ: Stejný identifikátor zdroje pro interní i půjčovní použití (hlavní záznam v Lhůtníku).
      asset_ref: {type: external_ref, target: 'centralni-lhutnik-a-objekty:asset', required: true, indexed: true}
      booking_kind: {type: enum, enum: booking_kind, required: true}
      case_id: {type: case_id, required: true, indexed: true}
      period_from: {type: timestamptz, required: true}
      period_to: {type: timestamptz, required: true}
      # EN: Link in one direction only (booking -> reservation), so there is no cyclic foreign key.
      # CZ: Vazba jen jedním směrem (rezervace kalendáře -> výpůjčka), takže nevzniká cyklický cizí klíč.
      rental_reservation_id: {type: ref, ref: rental_reservation.id, required: false, required_when: "booking_kind = 'RENTAL'"}
      status: {type: enum, enum: booking_status, required: true, default: HELD}
      released_reason: {type: text, required: false, required_when: "status = 'RELEASED'"}
    constraints:
      - {kind: check, expression: "period_to > period_from"}
      - {kind: check, expression: "(booking_kind = 'RENTAL') = (rental_reservation_id IS NOT NULL)"}
      # EN: One live booking per rental reservation.
      # CZ: Jedna živá rezervace kalendáře na jednu výpůjčku.
      - {kind: unique_partial, columns: [rental_reservation_id], where: "rental_reservation_id IS NOT NULL AND status <> 'RELEASED'"}
      # EN: No two live bookings of the same asset may overlap. Half-open range:
      #     a booking ending at 12:00 does not collide with one starting at 12:00.
      #     Intended PostgreSQL form:
      #       EXCLUDE USING gist (asset_ref WITH =, tstzrange(period_from, period_to, '[)') WITH &&)
      #       WHERE (status IN ('HELD', 'CONFIRMED'))
      #     Equality on a scalar column inside a GiST exclusion needs the btree_gist
      #     extension; verify against the official documentation of the deployed
      #     PostgreSQL version when Blok 16 is built.
      # CZ: Žádné dvě živé rezervace téhož zdroje se nesmí překrýt. Polootevřený interval:
      #     rezervace končící ve 12:00 nekoliduje s rezervací začínající ve 12:00.
      #     Zamýšlený tvar v PostgreSQL je uveden výše. Rovnost na skalárním sloupci
      #     uvnitř vylučovacího omezení GiST vyžaduje rozšíření btree_gist; ověřit proti
      #     oficiální dokumentaci nasazené verze PostgreSQL při stavbě Bloku 16.
      - kind: exclude
        using: gist
        elements:
          - "asset_ref WITH ="
          - "tstzrange(period_from, period_to, '[)') WITH &&"
        where: "status IN ('HELD', 'CONFIRMED')"
        requires_extension: btree_gist
    state_machine:
      field: status
      initial: HELD
      terminal: [RELEASED]
      transitions:
        # EN: A booking of kind RENTAL never changes state on its own: its transitions run
        #     only as members of the atomic operations listed in `atomic_operations` below.
        #     Bookings of the other kinds are switched by their owning record.
        # CZ: Rezervace kalendáře druhu RENTAL nikdy nemění stav sama: její přechody běží
        #     jen jako členové atomických operací vyjmenovaných v `atomic_operations` níže.
        #     Rezervace ostatních druhů přepíná jejich vlastnický záznam.
        - {from: HELD, to: CONFIRMED, action: confirm, guards: [booking_owner_confirmed]}
        - {from: HELD, to: RELEASED, action: release, guards: [reason_recorded]}
        - {from: CONFIRMED, to: RELEASED, action: release, guards: [reason_recorded, booking_owner_finished_or_cancelled]}

  # ---------------------------------------------------------------------------
  # EN: A rentable asset; the master record stays in centralni-lhutnik-a-objekty.
  # CZ: Půjčovatelný zdroj; hlavní záznam zůstává v centralni-lhutnik-a-objekty.
  # ---------------------------------------------------------------------------
  rental_asset:
    storage: rental
    table: rental_asset
    fields:
      id: {type: uuid, primary_key: true}
      asset_ref: {type: external_ref, target: 'centralni-lhutnik-a-objekty:asset', required: true, unique: true}
      asset_qr: {type: string, required: true, unique: true}    # EN: QR on the asset / CZ: QR na zdroji
      category: {type: enum, enum: asset_category, required: true}
      serial_number: {type: string, required: true}
      home_warehouse: {type: warehouse_code, required: true}
      rentable: {type: boolean, required: true, default: false}  # EN: released for rental by 1001 / CZ: do půjčovny uvolnil 1001
      compliance_kind: {type: enum, enum: compliance_kind, required: true}
      # EN: Deadline record in Lhutnik (calibration or inspection).
      # CZ: Záznam lhůty v Lhůtníku (kalibrace nebo revize / kontrola).
      lhutnik_deadline_ref: {type: external_ref, target: 'centralni-lhutnik-a-objekty:deadline', required: true}
      accessories: {type: json, required: false}        # EN: list of accessories / CZ: seznam příslušenství
      status: {type: enum, enum: asset_status, required: true, default: IN_STOCK}
    state_machine:
      field: status
      initial: IN_STOCK
      terminal: [RETIRED]
      transitions:
        # EN: An internal trip needs its own confirmed booking, so it cannot take an asset promised to a renter.
        # CZ: Interní výjezd potřebuje vlastní potvrzenou rezervaci, takže nemůže vzít zdroj slíbený nájemci.
        - {from: IN_STOCK, to: OUT_INTERNAL, action: issue_internal, guards: [compliance_valid_today, internal_booking_confirmed]}
        - {from: OUT_INTERNAL, to: IN_STOCK, action: return_internal, guards: [compliance_valid_today]}
        - {from: OUT_INTERNAL, to: IN_SERVICE, action: send_to_service, guards: [reason_recorded]}
        - {from: OUT_INTERNAL, to: BLOCKED, action: block_expired, guards: [compliance_expired]}
        # EN: hand_over, take_back and write_off_lost never run alone: each is a member of an
        #     atomic operation together with the transition of the rental reservation
        #     (see `atomic_operations` below).
        # CZ: hand_over, take_back a write_off_lost nikdy neběží samostatně: každý je členem
        #     atomické operace spolu s přechodem výpůjčky (viz `atomic_operations` níže).
        - {from: IN_STOCK, to: OUT_RENTAL, action: hand_over, guards: [reservation_confirmed, handover_protocol_sealed, compliance_valid_whole_period]}
        # EN: Also the way back after a declared loss (late return): the asset is still
        #     OUT_RENTAL then, so it always passes through RETURN_INSPECTION.
        # CZ: Také cesta zpět po ohlášené ztrátě (pozdní vrácení): zdroj je tehdy stále
        #     OUT_RENTAL, takže vždy projde přejímkou RETURN_INSPECTION.
        - {from: OUT_RENTAL, to: RETURN_INSPECTION, action: take_back, guards: [return_protocol_sealed]}
        # EN: Irreversible write-off: only when the loss case is closed (loss claim SETTLED
        #     or DISMISSED, no sealed return protocol) and only inside the atomic operation
        #     close_after_loss, which closes the reservation at the same moment. Until then
        #     the asset stays OUT_RENTAL and a late return remains possible. An asset found
        #     after the write-off does not come back through this state machine: it is a new
        #     acquisition decided by 1001 with a new master record in Lhutnik.
        # CZ: Nevratný odpis: jen při uzavřeném případu ztráty (škoda se ztrátou SETTLED nebo
        #     DISMISSED, žádný zapečetěný vratný protokol) a jen uvnitř atomické operace
        #     close_after_loss, která ve stejném okamžiku uzavírá výpůjčku. Do té doby zůstává
        #     zdroj OUT_RENTAL a pozdní vrácení je stále možné. Zdroj nalezený po odpisu se
        #     tímto automatem nevrací: jde o nové pořízení, o němž rozhodne 1001, s novým
        #     hlavním záznamem v Lhůtníku.
        - {from: OUT_RENTAL, to: RETIRED, action: write_off_lost, guards: [loss_case_closed, mutation_confirm_1001]}
        # EN: Planned calibration or repair straight from stock; the service window blocks the calendar.
        # CZ: Plánovaná kalibrace nebo oprava přímo ze skladu; servisní okno zablokuje kalendář.
        - {from: IN_STOCK, to: IN_SERVICE, action: send_to_service, guards: [reason_recorded, service_booking_held]}
        - {from: RETURN_INSPECTION, to: IN_STOCK, action: accept, guards: [condition_ok_or_wear, compliance_valid_today]}
        - {from: RETURN_INSPECTION, to: IN_SERVICE, action: send_to_service, guards: [reason_recorded]}
        - {from: RETURN_INSPECTION, to: BLOCKED, action: block_expired, guards: [compliance_expired]}
        - {from: IN_SERVICE, to: IN_STOCK, action: back_from_service, guards: [compliance_valid_today]}
        - {from: IN_STOCK, to: BLOCKED, action: block_expired, guards: [compliance_expired]}
        - {from: BLOCKED, to: IN_SERVICE, action: send_to_service, guards: [reason_recorded]}
        - {from: IN_STOCK, to: RETIRED, action: retire, guards: [mutation_confirm_1001]}
        - {from: IN_SERVICE, to: RETIRED, action: retire, guards: [mutation_confirm_1001]}
        - {from: BLOCKED, to: RETIRED, action: retire, guards: [mutation_confirm_1001]}

  # ---------------------------------------------------------------------------
  # EN: Who may rent. No PII: only a company code or a personal number.
  # CZ: Kdo si smí půjčovat. Bez PII: jen kód firmy nebo osobní číslo.
  # ---------------------------------------------------------------------------
  renter:
    storage: rental
    table: renter
    fields:
      id: {type: uuid, primary_key: true}
      renter_type: {type: enum, enum: renter_type, required: true}
      org_code: {type: org_code, required: false, required_when: "renter_type = 'B2B_CUSTOMER'"}
      # EN: Personal number of a Certified Partner SUB (series 1001-9999).
      # CZ: Osobní číslo Certified Partner SUB (řada 1001–9999).
      sub_person_no: {type: person_no, required: false, required_when: "renter_type = 'CERTIFIED_PARTNER_SUB'"}
      framework_contract_ref: {type: external_ref, target: 'spisy:document', required: false, required_to_close: true}
      status: {type: enum, enum: renter_status, required: true, default: PENDING_VERIFICATION}
      approved_decisions_ref: {type: external_ref, target: 'decisions:item', required: false, required_to_close: true}
      suspend_reason: {type: text, required: false, required_when: "status = 'SUSPENDED'"}
      reject_reason: {type: text, required: false, required_when: "status = 'REJECTED'"}
    constraints:
      - {kind: check, expression: "(renter_type = 'B2B_CUSTOMER' AND org_code IS NOT NULL) OR (renter_type = 'CERTIFIED_PARTNER_SUB' AND sub_person_no IS NOT NULL)"}
    state_machine:
      field: status
      initial: PENDING_VERIFICATION
      terminal: []                # EN: a rejected renter may apply again / CZ: zamítnutý nájemce může požádat znovu
      transitions:
        - {from: PENDING_VERIFICATION, to: APPROVED, action: approve, guards: [framework_contract_signed, decisions_ref_recorded, mutation_confirm_1001]}
        - {from: PENDING_VERIFICATION, to: REJECTED, action: reject, guards: [reason_recorded, mutation_confirm_1001]}
        - {from: REJECTED, to: PENDING_VERIFICATION, action: reapply, guards: [reason_recorded]}
        - {from: APPROVED, to: SUSPENDED, action: suspend, guards: [reason_recorded]}
        - {from: SUSPENDED, to: APPROVED, action: reinstate, guards: [decisions_ref_recorded, mutation_confirm_1001]}
    close_requirements:           # EN: needed for APPROVED / CZ: nutné pro stav APPROVED
      fields: [framework_contract_ref, approved_decisions_ref]

  # ---------------------------------------------------------------------------
  # EN: Price list header and lines. All amounts are empty until 1001 approves.
  # CZ: Hlavička a řádky ceníku. Všechny částky jsou prázdné do schválení 1001.
  # ---------------------------------------------------------------------------
  rental_price_list:
    storage: rental
    table: rental_price_list
    fields:
      id: {type: uuid, primary_key: true}
      name: {type: string, required: true}
      currency: {type: currency, required: true}
      valid_from: {type: date, required: false, required_to_close: true}
      status: {type: enum, enum: price_list_status, required: true, default: DRAFT_PROPOSAL}
      approved_decisions_ref: {type: external_ref, target: 'decisions:item', required: false, required_to_close: true}
    state_machine:
      field: status
      initial: DRAFT_PROPOSAL
      terminal: [RETIRED]
      transitions:
        - {from: DRAFT_PROPOSAL, to: APPROVED, action: approve, guards: [all_lines_priced, mutation_confirm_1001]}
        - {from: DRAFT_PROPOSAL, to: RETIRED, action: withdraw, guards: [reason_recorded]}
        - {from: APPROVED, to: RETIRED, action: retire, guards: [mutation_confirm_1001]}
    close_requirements:           # EN: needed for APPROVED / CZ: nutné pro stav APPROVED
      fields: [valid_from, approved_decisions_ref]

  rental_price_line:
    storage: rental
    table: rental_price_line
    fields:
      id: {type: uuid, primary_key: true}
      price_list_id: {type: ref, ref: rental_price_list.id, required: true}
      category: {type: enum, enum: asset_category, required: true}
      asset_id: {type: ref, ref: rental_asset.id, required: false}   # EN: optional per-asset price / CZ: volitelná cena pro konkrétní zdroj
      # EN: Amounts intentionally nullable: no invented numbers in the design.
      # CZ: Částky záměrně mohou být prázdné: návrh neobsahuje vymyšlená čísla.
      daily_rate: {type: decimal, required: false, required_to_close: true}
      deposit_amount: {type: decimal, required: false, required_to_close: true}
    constraints:
      - {kind: check, expression: "(daily_rate IS NULL OR daily_rate > 0) AND (deposit_amount IS NULL OR deposit_amount >= 0)"}
    close_requirements:           # EN: needed before the list can be APPROVED / CZ: nutné před schválením ceníku
      fields: [daily_rate, deposit_amount]

  # ---------------------------------------------------------------------------
  # EN: One rental of one asset for one period, always under a file number.
  # CZ: Jedna výpůjčka jednoho zdroje na jedno období, vždy pod číslem spisu.
  # ---------------------------------------------------------------------------
  rental_reservation:
    storage: rental
    table: rental_reservation
    fields:
      id: {type: uuid, primary_key: true}
      case_id: {type: case_id, required: true, indexed: true}
      asset_id: {type: ref, ref: rental_asset.id, required: true}
      renter_id: {type: ref, ref: renter.id, required: true}
      # EN: The slot is held by a resource_booking row (kind RENTAL) that points to this
      #     reservation; it is created at request, so the slot cannot be taken between
      #     request and confirmation. Period here and in the booking must be identical.
      # CZ: Termín drží řádek resource_booking (druh RENTAL), který odkazuje na tuto
      #     výpůjčku; vzniká už při žádosti, takže termín nelze mezi žádostí a potvrzením
      #     obsadit. Období zde a v rezervaci kalendáře musí být shodné.
      period_from: {type: timestamptz, required: true}
      period_to: {type: timestamptz, required: true}
      price_list_id: {type: ref, ref: rental_price_list.id, required: false, required_to_close: true}
      deposit_amount: {type: decimal, required: false, required_to_close: true}
      deposit_currency: {type: currency, required: false, required_to_close: true}
      deposit_status: {type: enum, enum: deposit_status, required: true, default: NOT_SET}
      # EN: Decision of 1001 that no deposit is collected, or the approved price list with a zero deposit.
      # CZ: Rozhodnutí 1001, že se kauce nevybírá, nebo schválený ceník s nulovou kaucí.
      deposit_waiver_decisions_ref: {type: external_ref, target: 'decisions:item', required: false, required_when: "deposit_status = 'WAIVED'"}
      confirmed_decisions_ref: {type: external_ref, target: 'decisions:item', required: false, required_to_close: true}
      # EN: Decision of 1001 that accepted a late return after a declared loss (audit trail).
      # CZ: Rozhodnutí 1001, kterým bylo přijato pozdní vrácení po ohlášené ztrátě (auditní stopa).
      late_return_decisions_ref: {type: external_ref, target: 'decisions:item', required: false}
      # EN: Child protocols and invoice requests reference reservation_id (avoids cyclic FK).
      # CZ: Podřízené protokoly a podklady fakturace odkazují na reservation_id (bez cyklického FK).
      status: {type: enum, enum: reservation_status, required: true, default: DRAFT}
      # EN: Decisions item that lists the follow-up bookings of the asset hit by a delay or loss.
      # CZ: Položka Decisions se seznamem návazných rezervací zdroje, které zasáhlo prodlení nebo ztráta.
      follow_up_decisions_ref: {type: external_ref, target: 'decisions:item', required: false, required_when: "status IN ('OVERDUE', 'NOT_RETURNED')"}
      status_reason: {type: text, required: false, required_when: "status IN ('REJECTED', 'PREEMPTED', 'CANCELLED', 'NOT_RETURNED')"}
    constraints:
      - {kind: check, expression: "period_to > period_from"}
      - {kind: check, expression: "deposit_amount IS NULL OR deposit_amount >= 0"}
      # EN: No overlap of the same asset: enforced by the exclusion constraint of
      #     resource_booking (entity above) for internal and rental bookings together.
      # CZ: Žádný překryv téhož zdroje: vynucuje vylučovací omezení entity
      #     resource_booking (výše) pro interní i půjčovní rezervace dohromady.
      - {kind: exclusion_via, entity: resource_booking, columns: [asset_id, period_from, period_to]}
    state_machine:
      field: status
      initial: DRAFT
      terminal: [CLOSED, REJECTED, PREEMPTED, CANCELLED]
      transitions:
        # EN: A transition with `atomic:` is the entry point of the atomic operation of that
        #     name (see `atomic_operations` below) and never runs outside it. Its guards speak
        #     only about the state BEFORE the operation, so no guard waits for a change that
        #     the same operation is about to make.
        # CZ: Přechod s klíčem `atomic:` je vstupním bodem stejnojmenné atomické operace
        #     (viz `atomic_operations` níže) a mimo ni nikdy neběží. Jeho zámky mluví jen
        #     o stavu PŘED operací, takže žádný zámek nečeká na změnu, kterou má táž operace
        #     teprve provést.
        # EN: The exclusion constraint guards only PLANNED intervals. An asset that is overdue
        #     or lost is physically unavailable beyond its interval, so request and confirm
        #     also need asset_not_overdue_or_lost.
        # CZ: Vylučovací omezení hlídá jen PLÁNOVANÉ intervaly. Zdroj v prodlení nebo ztracený
        #     je fyzicky nedostupný i mimo svůj interval, proto žádost i potvrzení vyžadují
        #     také asset_not_overdue_or_lost.
        - {from: DRAFT, to: REQUESTED, action: request, atomic: request_rental, guards: [renter_approved, asset_rentable, asset_not_overdue_or_lost, slot_free_for_rental, compliance_valid_whole_period]}
        - {from: REQUESTED, to: CONFIRMED, action: confirm, atomic: confirm_rental, guards: [renter_approved, asset_rentable, asset_not_overdue_or_lost, price_list_approved, rental_booking_is_held, compliance_valid_whole_period, deposit_terms_set, confirmed_in_decisions, mutation_confirm_1001]}
        - {from: REQUESTED, to: REJECTED, action: reject, atomic: reject_rental, guards: [reason_recorded, rental_booking_is_held]}
        # EN: The held rental booking is released and the internal booking inserted in ONE transaction.
        # CZ: Držená půjčovní rezervace se uvolní a interní rezervace se vloží v JEDNÉ transakci.
        - {from: REQUESTED, to: PREEMPTED, action: preempt_by_internal_revision, atomic: preempt_rental, guards: [internal_revision_request_approved, reason_recorded, rental_booking_is_held]}
        - {from: CONFIRMED, to: HANDED_OVER, action: hand_over, atomic: hand_over_rental, guards: [deposit_received, handover_protocol_sealed, compliance_valid_whole_period]}
        - {from: HANDED_OVER, to: RETURNED, action: take_back, atomic: take_back_rental, guards: [return_protocol_sealed]}
        # EN: Asset lost or not returned: no return protocol exists, the loss goes to 1001.
        #     The asset stays OUT_RENTAL; it is written off only when the loss case is closed.
        # CZ: Zdroj ztracen nebo nevrácen: vratný protokol neexistuje, ztráta jde k 1001.
        #     Zdroj zůstává OUT_RENTAL; odepisuje se až při uzavření případu ztráty.
        - {from: HANDED_OVER, to: NOT_RETURNED, action: declare_loss, guards: [loss_claim_opened, follow_up_bookings_escalated, reason_recorded, mutation_confirm_1001]}
        # EN: Delay: set by the server as soon as the planned return passes. From that moment
        #     the asset blocks every new request and confirmation, and all its follow-up
        #     bookings are escalated in one Decisions item.
        # CZ: Prodlení: nastaví server, jakmile uplyne plánované vrácení. Od té chvíle zdroj
        #     blokuje každou novou žádost i potvrzení a všechny jeho návazné rezervace jsou
        #     eskalovány v jedné položce Decisions.
        - {from: HANDED_OVER, to: OVERDUE, action: mark_overdue, guards: [return_period_elapsed, follow_up_bookings_escalated]}
        - {from: OVERDUE, to: RETURNED, action: take_back_overdue, atomic: take_back_overdue_rental, guards: [return_protocol_sealed]}
        - {from: OVERDUE, to: NOT_RETURNED, action: declare_loss, guards: [loss_claim_opened, follow_up_bookings_escalated, reason_recorded, mutation_confirm_1001]}
        # EN: Late return after a declared loss: audited, confirmed by 1001, and in the same
        #     operation the asset goes through RETURN_INSPECTION like any other return.
        # CZ: Pozdní vrácení po ohlášené ztrátě: auditované, potvrzené 1001 a ve stejné
        #     operaci jde zdroj do přejímky RETURN_INSPECTION jako při každém jiném vrácení.
        - {from: NOT_RETURNED, to: RETURNED, action: take_back_late, atomic: take_back_late_rental, guards: [return_protocol_sealed, late_return_audited, mutation_confirm_1001]}
        - {from: RETURNED, to: CLOSED, action: close, atomic: close_rental, guards: [deposit_settled, damage_claims_resolved, invoice_request_handed_to_finance, rental_booking_is_confirmed]}
        - {from: NOT_RETURNED, to: CLOSED, action: close_after_loss, atomic: close_after_loss, guards: [deposit_settled, damage_claims_resolved, invoice_request_handed_to_finance, rental_booking_is_confirmed]}
        - {from: DRAFT, to: CANCELLED, action: cancel, guards: [reason_recorded]}
        - {from: REQUESTED, to: CANCELLED, action: cancel, atomic: cancel_requested_rental, guards: [reason_recorded, rental_booking_is_held]}
        # EN: A confirmed rental is never cancelled automatically; a clash with
        #     an internal revision trip goes to 1001 in Decisions.
        # CZ: Potvrzená výpůjčka se nikdy neruší automaticky; střet s interním
        #     revizním výjezdem jde k 1001 do Decisions.
        - {from: CONFIRMED, to: CANCELLED, action: cancel_confirmed, atomic: cancel_confirmed_rental, guards: [reason_recorded, rental_booking_is_confirmed, protocols_discarded, mutation_confirm_1001]}
    close_requirements:           # EN: needed for CLOSED / CZ: nutné pro stav CLOSED
      fields: [price_list_id, deposit_amount, deposit_currency, confirmed_decisions_ref]

  # ---------------------------------------------------------------------------
  # EN: Digital handover / return protocol with photo documentation. Handover
  #     (Part A) and return (Part B) are TWO records, each signed and sealed on its own.
  # CZ: Digitální předávací / vratný protokol s fotodokumentací. Předání (Část A)
  #     a vrácení (Část B) jsou DVA záznamy, každý se podepisuje a pečetí samostatně.
  # ---------------------------------------------------------------------------
  handover_protocol:
    storage: rental
    table: handover_protocol
    fields:
      id: {type: uuid, primary_key: true}
      reservation_id: {type: ref, ref: rental_reservation.id, required: true}
      case_id: {type: case_id, required: true, indexed: true}
      direction: {type: enum, enum: protocol_direction, required: true}
      performed_at: {type: timestamptz, required: false, required_to_close: true}
      place: {type: warehouse_code, required: false, required_to_close: true}
      # EN: Polarita side: a living person, never an ai.
      # CZ: Strana Polarity: živá osoba, nikdy ai.
      polarita_person_no: {type: person_no, required: false, required_to_close: true}
      # EN: Renter's signer as a reference only; the name is rendered into the
      #     PDF from the contact register and is not stored here.
      # CZ: Podepisující za nájemce jen odkazem; jméno se do PDF doplní
      #     z registru kontaktů a zde se neukládá.
      renter_signer_ref: {type: external_ref, target: 'registr-kontaktu:contact', required: false, required_to_close: true}
      condition: {type: enum, enum: condition_grade, required: false, required_to_close: true}
      condition_note: {type: text, required: false, required_when: "condition IN ('DAMAGED', 'INCOMPLETE', 'NOT_WORKING')"}
      accessories_check: {type: json, required: false, required_to_close: true}   # EN: item -> present yes/no / CZ: položka -> přítomno ano/ne
      photo_keys: {type: json, required: false, required_to_close: true}          # EN: list of Garage keys / CZ: seznam klíčů v Garage
      # EN: Snapshot from Lhutnik at the moment of the protocol.
      # CZ: Otisk z Lhůtníku v okamžiku protokolu.
      compliance_valid_until: {type: date, required: false, required_to_close: true}
      compliance_document_ref: {type: external_ref, target: 'centralni-lhutnik-a-objekty:calibration', required: false, required_to_close: true}
      # EN: Readings for generators (hours, fuel); empty for instruments.
      # CZ: Stavy u elektrocentrál (motohodiny, palivo); u měřidel prázdné.
      operating_hours: {type: decimal, required: false}
      fuel_level_percent: {type: integer, required: false, min: 0, max: 100}
      safety_briefing_confirmed: {type: boolean, required: false, required_when: "direction = 'HANDOVER'"}
      polarita_signature_key: {type: object_key, required: false, required_to_close: true}
      renter_signature_key: {type: object_key, required: false, required_to_close: true}
      pdf_key: {type: object_key, required: false, required_to_close: true}
      seal_ref: {type: string, required: false, required_to_close: true}          # EN: pyHanko seal + TSA / CZ: pečeť pyHanko + TSA
      supersedes_protocol_id: {type: ref, ref: handover_protocol.id, required: false}
      superseded_reason: {type: text, required: false, required_when: "status IN ('SUPERSEDED', 'DISCARDED')"}
      status: {type: enum, enum: protocol_status, required: true, default: DRAFT}
    constraints:
      # EN: One ORIGINAL protocol per reservation and direction, and one replacement per
      #     protocol. A replacement (supersedes_protocol_id set) may therefore be drafted,
      #     signed and sealed while the original is still SEALED — no deadlock.
      # CZ: Jeden PŮVODNÍ protokol na výpůjčku a směr a jedna náhrada na protokol. Náhradu
      #     (má supersedes_protocol_id) lze proto rozpracovat, podepsat a zapečetit, dokud je
      #     původní protokol ještě SEALED — bez zablokování.
      - {kind: unique_partial, columns: [reservation_id, direction], where: "supersedes_protocol_id IS NULL AND status <> 'DISCARDED'"}
      - {kind: unique_partial, columns: [supersedes_protocol_id], where: "supersedes_protocol_id IS NOT NULL AND status <> 'DISCARDED'"}
      # EN: A replacement must belong to the SAME reservation and the SAME direction as the
      #     protocol it replaces. Enforced by a composite foreign key onto a composite unique
      #     key of the same table; rows without supersedes_protocol_id are not affected
      #     (intended PostgreSQL form: UNIQUE (id, reservation_id, direction) and
      #     FOREIGN KEY (supersedes_protocol_id, reservation_id, direction) REFERENCES
      #     handover_protocol (id, reservation_id, direction) with the default MATCH SIMPLE;
      #     verify against the official documentation of the deployed PostgreSQL version
      #     when Blok 16 is built). A protocol never replaces itself.
      # CZ: Náhrada musí patřit ke STEJNÉ výpůjčce a mít STEJNÝ směr jako protokol, který
      #     nahrazuje. Vynucuje to složený cizí klíč na složený unikátní klíč téže tabulky;
      #     řádků bez supersedes_protocol_id se netýká (zamýšlený tvar v PostgreSQL je uveden
      #     výše; ověřit proti oficiální dokumentaci nasazené verze PostgreSQL při stavbě
      #     Bloku 16). Protokol nikdy nenahrazuje sám sebe.
      - {kind: unique, columns: [id, reservation_id, direction]}
      - {kind: foreign_key, columns: [supersedes_protocol_id, reservation_id, direction], ref_entity: handover_protocol, ref_columns: [id, reservation_id, direction]}
      - {kind: check, expression: "supersedes_protocol_id IS NULL OR supersedes_protocol_id <> id"}
      # EN: A draft may exist before the briefing; signing a handover without it is impossible.
      # CZ: Rozpracovaný protokol smí existovat před poučením; podepsat předání bez něj nelze.
      - {kind: check, expression: "status IN ('DRAFT', 'DISCARDED') OR direction <> 'HANDOVER' OR safety_briefing_confirmed IS TRUE"}
    state_machine:
      field: status
      initial: DRAFT
      terminal: [SUPERSEDED, DISCARDED]
      transitions:
        - {from: DRAFT, to: SIGNED, action: sign, guards: [photos_minimum_met, accessories_checked, safety_briefing_if_handover, both_signatures_present, replacement_matches_original]}
        - {from: SIGNED, to: SEALED, action: seal, guards: [pdf_rendered, server_seal_applied]}
        # EN: Runs in the same transaction as the seal of the replacement, so exactly one
        #     protocol per reservation and direction is valid at any moment.
        # CZ: Běží ve stejné transakci jako zapečetění náhrady, takže v každém okamžiku platí
        #     právě jeden protokol na výpůjčku a směr.
        - {from: SEALED, to: SUPERSEDED, action: supersede, guards: [replacement_protocol_sealed, reason_recorded, mutation_confirm_1001]}
        # EN: An unsealed protocol that will not be used (cancelled rental, wrong asset).
        # CZ: Nezapečetěný protokol, který se nepoužije (zrušená výpůjčka, jiný zdroj).
        - {from: DRAFT, to: DISCARDED, action: discard, guards: [reason_recorded]}
        - {from: SIGNED, to: DISCARDED, action: discard, guards: [reason_recorded]}
    close_requirements:           # EN: needed for SEALED / CZ: nutné pro stav SEALED
      fields: [performed_at, place, polarita_person_no, renter_signer_ref, condition, accessories_check, photo_keys, compliance_valid_until, compliance_document_ref, polarita_signature_key, renter_signature_key, pdf_key, seal_ref]

  # ---------------------------------------------------------------------------
  # EN: Append-only deposit ledger; movements of money are confirmed by 1001.
  # CZ: Neměnný deník kaucí; pohyby peněz potvrzuje 1001.
  # ---------------------------------------------------------------------------
  deposit_transaction:
    storage: rental
    table: deposit_transaction
    append_only: true
    fields:
      id: {type: uuid, primary_key: true}
      reservation_id: {type: ref, ref: rental_reservation.id, required: true}
      case_id: {type: case_id, required: true, indexed: true}
      kind: {type: enum, enum: deposit_kind, required: true}
      amount: {type: decimal, required: true}
      currency: {type: currency, required: true}
      # EN: Read-only match with the bank statement via finance-uol-marze-engine.
      # CZ: Párování s bankovním výpisem jen pro čtení přes finance-uol-marze-engine.
      bank_match_ref: {type: external_ref, target: 'finance-uol-marze-engine:bank_match', required: false, required_when: "kind IN ('RECEIVED', 'REFUNDED')"}
      decisions_ref: {type: external_ref, target: 'decisions:item', required: false, required_when: "kind IN ('REFUNDED', 'WITHHELD')"}
      reason: {type: text, required: false, required_when: "kind = 'WITHHELD'"}
      recorded_at: {type: timestamptz, required: true}
    constraints:
      - {kind: check, expression: "amount > 0"}

  # ---------------------------------------------------------------------------
  # EN: Damage found on return, or loss of an asset that was never returned.
  # CZ: Škoda zjištěná při vrácení, nebo ztráta zdroje, který se nevrátil.
  # ---------------------------------------------------------------------------
  damage_claim:
    storage: rental
    table: damage_claim
    fields:
      id: {type: uuid, primary_key: true}
      reservation_id: {type: ref, ref: rental_reservation.id, required: true}
      case_id: {type: case_id, required: true, indexed: true}
      # EN: loss = true: the asset did not come back, so there is no return protocol.
      # CZ: loss = true: zdroj se nevrátil, vratný protokol proto neexistuje.
      loss: {type: boolean, required: true, default: false}
      return_protocol_id: {type: ref, ref: handover_protocol.id, required: false, required_when: "loss = false"}
      description: {type: text, required: true}
      photo_keys: {type: json, required: true}
      estimate_amount: {type: decimal, required: false, required_to_close: true}
      estimate_currency: {type: currency, required: false, required_to_close: true}
      decisions_ref: {type: external_ref, target: 'decisions:item', required: false, required_to_close: true}
      status: {type: enum, enum: damage_status, required: true, default: OPEN}
    state_machine:
      field: status
      initial: OPEN
      terminal: [SETTLED, DISMISSED]
      transitions:
        - {from: OPEN, to: ESTIMATED, action: estimate, guards: [estimate_recorded]}
        - {from: ESTIMATED, to: APPROVED, action: approve, guards: [mutation_confirm_1001]}
        - {from: APPROVED, to: SETTLED, action: settle, guards: [deposit_settled]}
        - {from: OPEN, to: DISMISSED, action: dismiss, guards: [reason_recorded, mutation_confirm_1001]}
        - {from: ESTIMATED, to: DISMISSED, action: dismiss, guards: [reason_recorded, mutation_confirm_1001]}
    close_requirements:           # EN: needed for SETTLED / CZ: nutné pro stav SETTLED
      fields: [estimate_amount, estimate_currency, decisions_ref]

  # ---------------------------------------------------------------------------
  # EN: Billing basis handed to finance-uol-marze-engine (DRAFT invoice only).
  # CZ: Podklad k fakturaci předaný do finance-uol-marze-engine (jen DRAFT faktury).
  # ---------------------------------------------------------------------------
  rental_invoice_request:
    storage: rental
    table: rental_invoice_request
    fields:
      id: {type: uuid, primary_key: true}
      reservation_id: {type: ref, ref: rental_reservation.id, required: true, unique: true}
      case_id: {type: case_id, required: true, indexed: true}
      price_list_id: {type: ref, ref: rental_price_list.id, required: true}
      billed_from: {type: timestamptz, required: true}
      billed_to: {type: timestamptz, required: true}
      # EN: Computed from the approved price list only, never typed by ai.
      # CZ: Počítá se výhradně ze schváleného ceníku, ai částku nikdy nepíše ručně.
      net_amount: {type: decimal, required: false, derived: true, required_to_close: true}
      currency: {type: currency, required: false, required_to_close: true}
      decisions_ref: {type: external_ref, target: 'decisions:item', required: false, required_to_close: true}
      finance_ref: {type: external_ref, target: 'finance-uol-marze-engine:invoice_draft', required: false, required_to_close: true}
      status: {type: enum, enum: invoice_request_status, required: true, default: DRAFT}
    constraints:
      - {kind: check, expression: "billed_to > billed_from"}
      - {kind: check, expression: "net_amount IS NULL OR net_amount >= 0"}
    state_machine:
      field: status
      initial: DRAFT
      terminal: [HANDED_TO_FINANCE]
      transitions:
        # EN: Billing uses the price list fixed at confirmation, even if it was retired since.
        # CZ: Fakturuje se podle ceníku zafixovaného při potvrzení, i když byl mezitím stažen.
        - {from: DRAFT, to: IN_DECISIONS, action: submit, guards: [price_list_matches_reservation, return_protocol_sealed_or_loss_declared]}
        - {from: IN_DECISIONS, to: APPROVED, action: approve, guards: [mutation_confirm_1001]}
        - {from: IN_DECISIONS, to: DRAFT, action: send_back, guards: [reason_recorded]}
        - {from: APPROVED, to: HANDED_TO_FINANCE, action: hand_to_finance, guards: [finance_draft_created]}
    close_requirements:           # EN: needed for HANDED_TO_FINANCE / CZ: nutné pro stav HANDED_TO_FINANCE
      fields: [net_amount, currency, decisions_ref, finance_ref]

# EN: Atomic operations. Records whose states depend on each other (rental reservation,
#     its calendar booking, the rented asset) never change one after another. The server
#     runs each operation below as ONE transaction in four steps:
#       1. lock all member rows (fixed order: reservation, booking, asset);
#       2. check that every member is in its `from` state and evaluate the guards of ALL
#          member transitions once, over the state BEFORE the operation;
#       3. write all `to` states;
#       4. check the proposed combination of states against `invariants`.
#     If any step fails, nothing is written. A member transition is never offered as
#     a separate action for a rental. `invariants` list, for every reservation status,
#     the allowed status of its live booking (NONE = no booking row) and of its asset.
# CZ: Atomické operace. Záznamy, jejichž stavy na sobě závisí (výpůjčka, její rezervace
#     v kalendáři, půjčený zdroj), se nikdy nemění jeden po druhém. Server provede každou
#     operaci níže jako JEDNU transakci ve čtyřech krocích:
#       1. zamkne všechny členské řádky (pevné pořadí: výpůjčka, rezervace kalendáře, zdroj);
#       2. ověří, že každý člen je ve svém stavu `from`, a zámky VŠECH členských přechodů
#          vyhodnotí jednou nad stavem PŘED operací;
#       3. zapíše všechny stavy `to`;
#       4. ověří navrženou kombinaci stavů proti `invariants`.
#     Selže-li kterýkoli krok, nezapíše se nic. Členský přechod se u výpůjčky nikdy nenabízí
#     jako samostatná akce. `invariants` uvádějí pro každý stav výpůjčky přípustný stav její
#     živé rezervace kalendáře (NONE = řádek rezervace neexistuje) a jejího zdroje.
atomic_operations:
  invariants:
    reservation_booking:
      DRAFT: [NONE]
      REQUESTED: [HELD]
      CONFIRMED: [CONFIRMED]
      HANDED_OVER: [CONFIRMED]
      OVERDUE: [CONFIRMED]
      RETURNED: [CONFIRMED]
      NOT_RETURNED: [CONFIRMED]
      CLOSED: [RELEASED]
      REJECTED: [RELEASED]
      PREEMPTED: [RELEASED]
      CANCELLED: [NONE, RELEASED]   # EN: NONE = cancelled as DRAFT / CZ: NONE = zrušeno ve stavu DRAFT
    # EN: Only the statuses that bind the asset are listed.
    # CZ: Uvedeny jsou jen stavy výpůjčky, které zdroj vážou.
    reservation_asset:
      HANDED_OVER: [OUT_RENTAL]
      OVERDUE: [OUT_RENTAL]
      NOT_RETURNED: [OUT_RENTAL]
  operations:
    # EN: `from: NONE` + `action: insert` = the operation inserts the booking row in its
    #     initial state; the exclusion constraint of resource_booking has the final word.
    # CZ: `from: NONE` + `action: insert` = operace vloží řádek rezervace kalendáře v jeho
    #     počátečním stavu; poslední slovo má vylučovací omezení entity resource_booking.
    request_rental:
      members:
        - {entity: rental_reservation, from: DRAFT, to: REQUESTED, action: request}
        - {entity: resource_booking, from: NONE, to: HELD, action: insert}
    confirm_rental:
      members:
        - {entity: rental_reservation, from: REQUESTED, to: CONFIRMED, action: confirm}
        - {entity: resource_booking, from: HELD, to: CONFIRMED, action: confirm}
    reject_rental:
      members:
        - {entity: rental_reservation, from: REQUESTED, to: REJECTED, action: reject}
        - {entity: resource_booking, from: HELD, to: RELEASED, action: release}
    preempt_rental:
      members:
        - {entity: rental_reservation, from: REQUESTED, to: PREEMPTED, action: preempt_by_internal_revision}
        - {entity: resource_booking, from: HELD, to: RELEASED, action: release}
    cancel_requested_rental:
      members:
        - {entity: rental_reservation, from: REQUESTED, to: CANCELLED, action: cancel}
        - {entity: resource_booking, from: HELD, to: RELEASED, action: release}
    cancel_confirmed_rental:
      members:
        - {entity: rental_reservation, from: CONFIRMED, to: CANCELLED, action: cancel_confirmed}
        - {entity: resource_booking, from: CONFIRMED, to: RELEASED, action: release}
    hand_over_rental:
      members:
        - {entity: rental_reservation, from: CONFIRMED, to: HANDED_OVER, action: hand_over}
        - {entity: rental_asset, from: IN_STOCK, to: OUT_RENTAL, action: hand_over}
    take_back_rental:
      members:
        - {entity: rental_reservation, from: HANDED_OVER, to: RETURNED, action: take_back}
        - {entity: rental_asset, from: OUT_RENTAL, to: RETURN_INSPECTION, action: take_back}
    take_back_overdue_rental:
      members:
        - {entity: rental_reservation, from: OVERDUE, to: RETURNED, action: take_back_overdue}
        - {entity: rental_asset, from: OUT_RENTAL, to: RETURN_INSPECTION, action: take_back}
    # EN: Late return after a declared loss: the reservation and the asset move together,
    #     so a returned asset can never stay written off or skip the inspection.
    # CZ: Pozdní vrácení po ohlášené ztrátě: výpůjčka i zdroj se mění společně, takže
    #     vrácený zdroj nemůže zůstat odepsaný ani minout přejímku.
    take_back_late_rental:
      members:
        - {entity: rental_reservation, from: NOT_RETURNED, to: RETURNED, action: take_back_late}
        - {entity: rental_asset, from: OUT_RENTAL, to: RETURN_INSPECTION, action: take_back}
    close_rental:
      members:
        - {entity: rental_reservation, from: RETURNED, to: CLOSED, action: close}
        - {entity: resource_booking, from: CONFIRMED, to: RELEASED, action: release}
    # EN: Closing a loss case writes the asset off in the same operation; this is the only
    #     way to write_off_lost, and after it no late return is possible (CLOSED is terminal).
    # CZ: Uzavření případu ztráty ve stejné operaci odepíše zdroj; je to jediná cesta
    #     k write_off_lost a po ní už pozdní vrácení možné není (CLOSED je koncový stav).
    close_after_loss:
      members:
        - {entity: rental_reservation, from: NOT_RETURNED, to: CLOSED, action: close_after_loss}
        - {entity: resource_booking, from: CONFIRMED, to: RELEASED, action: release}
        - {entity: rental_asset, from: OUT_RENTAL, to: RETIRED, action: write_off_lost}

# EN: Named guards used in the state machines above; evaluated on the server.
# CZ: Pojmenované zámky použité ve stavových automatech výše; vyhodnocuje server.
guards:
  compliance_valid_today: "EN: calibration / inspection in Lhutnik is valid today / CZ: kalibrace či revize v Lhůtníku dnes platí"
  compliance_valid_whole_period: "EN: calibration / inspection is valid until the planned return / CZ: kalibrace či revize platí až do plánovaného vrácení"
  compliance_expired: "EN: calibration / inspection in Lhutnik has expired / CZ: kalibrace či revize v Lhůtníku propadla"
  condition_ok_or_wear: "EN: return protocol condition is OK or WEAR / CZ: stav ve vratném protokolu je OK nebo WEAR"
  handover_protocol_sealed: "EN: HANDOVER protocol is SEALED / CZ: protokol HANDOVER je SEALED"
  return_protocol_sealed: "EN: RETURN protocol is SEALED / CZ: protokol RETURN je SEALED"
  return_protocol_sealed_or_loss_declared: "EN: RETURN protocol is SEALED, or the reservation is NOT_RETURNED / CZ: protokol RETURN je SEALED, nebo je výpůjčka ve stavu NOT_RETURNED"
  loss_claim_opened: "EN: a damage_claim with loss = true exists for the reservation / CZ: k výpůjčce existuje záznam damage_claim s loss = true"
  loss_case_closed: "EN: the reservation of the asset is NOT_RETURNED, its damage_claim with loss = true is SETTLED or DISMISSED and no RETURN protocol of the reservation is SEALED / CZ: výpůjčka zdroje je ve stavu NOT_RETURNED, její damage_claim s loss = true je SETTLED nebo DISMISSED a žádný protokol RETURN této výpůjčky není SEALED"
  late_return_audited: "EN: late_return_decisions_ref is recorded and the audit log holds the reason, the person who took the asset back and the loss claim concerned; a loss claim that is not terminal has loss switched to false and return_protocol_id set to the sealed RETURN protocol (it continues as an ordinary damage claim or is dismissed by 1001), a loss claim already SETTLED is re-decided by 1001 under the same Decisions item / CZ: je zapsáno late_return_decisions_ref a auditní záznam obsahuje důvod, osobu, která zdroj převzala, a dotčenou škodu se ztrátou; škoda, která není v koncovém stavu, má loss přepnuto na false a return_protocol_id nastaveno na zapečetěný protokol RETURN (pokračuje jako běžná škoda, nebo ji 1001 zamítne), o škodě již ve stavu SETTLED rozhodne 1001 znovu pod stejnou položkou Decisions"
  reservation_confirmed: "EN: a CONFIRMED rental_reservation of this asset covers today / CZ: dnešní den pokrývá výpůjčka tohoto zdroje ve stavu CONFIRMED"
  asset_not_overdue_or_lost: "EN: no reservation of the asset is OVERDUE or NOT_RETURNED, and none is HANDED_OVER with period_to in the past / CZ: žádná výpůjčka zdroje není ve stavu OVERDUE ani NOT_RETURNED a žádná není HANDED_OVER s period_to v minulosti"
  return_period_elapsed: "EN: period_to of the reservation has passed and no RETURN protocol of it is SEALED / CZ: period_to výpůjčky uplynulo a žádný její protokol RETURN není SEALED"
  follow_up_bookings_escalated: "EN: follow_up_decisions_ref is recorded and the Decisions item lists every live resource_booking of the asset that starts after the planned return: HELD rental requests stay unconfirmable (asset_not_overdue_or_lost) until rejected or moved to another asset, CONFIRMED rentals are decided by 1001 (never cancelled automatically), internal trips and service windows are passed to 14005; an empty list is recorded as well / CZ: je zapsáno follow_up_decisions_ref a položka Decisions vyjmenovává každou živou rezervaci kalendáře zdroje, která začíná po plánovaném vrácení: držené půjčovní žádosti nelze potvrdit (asset_not_overdue_or_lost), dokud nejsou zamítnuty nebo převedeny na jiný zdroj, o potvrzených výpůjčkách rozhodne 1001 (nikdy se neruší automaticky), interní výjezdy a servisní okna se předají 14005; zapisuje se i prázdný seznam"
  internal_booking_confirmed: "EN: a CONFIRMED resource_booking of kind INTERNAL_REVISION or INTERNAL_JOB covers the whole trip / CZ: celý výjezd pokrývá rezervace kalendáře druhu INTERNAL_REVISION nebo INTERNAL_JOB ve stavu CONFIRMED"
  service_booking_held: "EN: a resource_booking of kind SERVICE was inserted for the service window / CZ: pro servisní okno byla vložena rezervace kalendáře druhu SERVICE"
  protocols_discarded: "EN: no protocol of the reservation is in DRAFT or SIGNED, and none is SEALED (asset never left the store) / CZ: žádný protokol výpůjčky není DRAFT ani SIGNED a žádný není SEALED (zdroj sklad neopustil)"
  slot_free_for_rental: "EN: before the operation, the reservation has no live resource_booking and no live booking of the asset overlaps the period; the operation request_rental then inserts the booking (kind RENTAL, same asset and period) / CZ: před operací nemá výpůjčka žádnou živou rezervaci kalendáře a období se nepřekrývá s žádnou živou rezervací zdroje; operace request_rental pak rezervaci (druh RENTAL, stejný zdroj a období) vloží"
  rental_booking_is_held: "EN: before the operation, the live resource_booking of the reservation is HELD / CZ: před operací je živá rezervace kalendáře této výpůjčky ve stavu HELD"
  rental_booking_is_confirmed: "EN: before the operation, the live resource_booking of the reservation is CONFIRMED / CZ: před operací je živá rezervace kalendáře této výpůjčky ve stavu CONFIRMED"
  booking_owner_confirmed: "EN: kind RENTAL: the transition runs as a member of the atomic operation confirm_rental, whose invariants check the resulting pair of states; other kinds: the owning record (internal trip, service order) is confirmed / CZ: druh RENTAL: přechod běží jako člen atomické operace confirm_rental, jejíž invarianty ověřují výslednou dvojici stavů; ostatní druhy: vlastnický záznam (interní výjezd, servisní zakázka) je potvrzen"
  booking_owner_finished_or_cancelled: "EN: kind RENTAL: the transition runs as a member of an atomic operation that closes or cancels the reservation, whose invariants check the resulting pair of states; other kinds: the owning record is finished or cancelled / CZ: druh RENTAL: přechod běží jako člen atomické operace, která výpůjčku uzavírá nebo ruší a jejíž invarianty ověřují výslednou dvojici stavů; ostatní druhy: vlastnický záznam je dokončen nebo zrušen"
  framework_contract_signed: "EN: rental terms signed by both parties are in the file / CZ: oboustranně podepsané podmínky půjčovny jsou ve spisu"
  decisions_ref_recorded: "EN: approved_decisions_ref is populated / CZ: approved_decisions_ref je vyplněno"
  all_lines_priced: "EN: every price line has a rate and a deposit / CZ: každý řádek ceníku má sazbu i kauci"
  renter_approved: "EN: renter status is APPROVED / CZ: nájemce je ve stavu APPROVED"
  asset_rentable: "EN: asset has rentable = true and is not BLOCKED or RETIRED / CZ: zdroj má rentable = true a není BLOCKED ani RETIRED"
  internal_revision_request_approved: "EN: an internal revision trip that needs the asset in the period is approved by 14005 with a file number / CZ: interní revizní výjezd, který zdroj v období potřebuje, schválil 14005 pod číslem spisu"
  price_list_approved: "EN: price list status is APPROVED / CZ: ceník je ve stavu APPROVED"
  price_list_matches_reservation: "EN: price_list_id equals the price list of the reservation, which was APPROVED when the reservation was confirmed (it may be RETIRED now) / CZ: price_list_id je ceník výpůjčky, který byl při jejím potvrzení APPROVED (nyní může být RETIRED)"
  deposit_terms_set: "EN: price_list_id, deposit_amount and deposit_currency are set / CZ: price_list_id, deposit_amount a deposit_currency jsou nastaveny"
  confirmed_in_decisions: "EN: confirmed_decisions_ref is recorded / CZ: confirmed_decisions_ref je zapsáno"
  deposit_received: "EN: deposit_status is RECEIVED (matched on the bank statement) or WAIVED (deposit_waiver_decisions_ref recorded) / CZ: deposit_status je RECEIVED (kauce spárována na výpisu) nebo WAIVED (zapsáno deposit_waiver_decisions_ref)"
  deposit_settled: "EN: deposit_status is SETTLED (refunded or withheld with 1001 confirmation), or WAIVED (no deposit was collected, nothing to settle) / CZ: deposit_status je SETTLED (kauce vrácena nebo zadržena s potvrzením 1001), nebo WAIVED (kauce se nevybírala, není co vypořádat)"
  damage_claims_resolved: "EN: every damage_claim is SETTLED or DISMISSED / CZ: každá škoda je SETTLED nebo DISMISSED"
  invoice_request_handed_to_finance: "EN: rental_invoice_request is HANDED_TO_FINANCE / CZ: podklad k fakturaci je HANDED_TO_FINANCE"
  photos_minimum_met: "EN: photo count meets the PROPOSED minimum set by 1001 / CZ: počet fotografií splňuje minimum (NÁVRH — ke schválení 1001)"
  accessories_checked: "EN: every accessory item is ticked / CZ: každá položka příslušenství je odškrtnuta"
  safety_briefing_if_handover: "EN: for HANDOVER protocol, safety_briefing_confirmed is true / CZ: u protokolu HANDOVER je safety_briefing_confirmed true"
  both_signatures_present: "EN: both parties signed on the device / CZ: obě strany podepsaly na zařízení"
  pdf_rendered: "EN: protocol PDF rendered by Typst / CZ: PDF protokolu vysázeno v Typst"
  server_seal_applied: "EN: server seal with timestamp applied / CZ: připojena serverová pečeť s časovým razítkem"
  replacement_protocol_sealed: "EN: the replacement protocol whose supersedes_protocol_id points to this one is SEALED and has the same reservation_id and direction / CZ: náhradní protokol, jehož supersedes_protocol_id míří na tento, je ve stavu SEALED a má stejné reservation_id i direction"
  replacement_matches_original: "EN: supersedes_protocol_id is empty, or the protocol it points to is SEALED and has the same reservation_id and direction / CZ: supersedes_protocol_id je prázdné, nebo protokol, na který míří, je ve stavu SEALED a má stejné reservation_id i direction"
  estimate_recorded: "EN: repair estimate is stored / CZ: je uložen odhad opravy"
  finance_draft_created: "EN: invoice DRAFT exists in finance-uol-marze-engine / CZ: v finance-uol-marze-engine existuje DRAFT faktury"
  mutation_confirm_1001: "EN: confirmed by 1001 in Decisions / CZ: potvrzeno osobou 1001 v Decisions"
  reason_recorded: "EN: a written reason is stored / CZ: je uložen písemný důvod"
