# =============================================================================
# metadata-schema-kernel · declarative schema DRAFT / deklarativní schéma NÁVRH
# Module / Modul: dilensky-terminal · Blok 16 · balíček S4 · Verze 3.30.3
# EN: Touch workshop kiosk for switchboard assembly, routine verification and
#     CE / PHE label printing. Block 16 deploys the workshop module inside the
#     polarita-hq VM on Ejpovice.
# CZ: Dotykový dílenský kiosk pro kompletaci rozváděčů, kusové ověření a tisk
#     štítku CE / podkladu PHE. Dílenský modul se nasazuje v bloku 16 uvnitř
#     stávající VM polarita-hq na Ejpovicích.
# EN: The exact DSL of metadata-schema-kernel is fixed by 17001 during
#     implementation; this file is a design input, not a tested migration.
# CZ: Přesný formát (DSL) metadata-schema-kernel určí 17001 při implementaci;
#     tento soubor je návrhový podklad, ne otestovaná migrace.
# =============================================================================

schema:
  name: dilensky_terminal
  module: dilensky-terminal
  package: S4
  block: 16
  release: Polarita-3.30.3
  schema_version: 0.1.0-draft
  status: DRAFT                 # EN: proposal only / CZ: pouze návrh
  owner_ai: 17001               # EN: 17001 programator / CZ: 17001 programator
  operator_ai: 13001            # EN: warehouse MAIN-101 operations / CZ: provoz skladu MAIN-101
  judges: [15002, 17004]        # EN: independent review / CZ: nezávislá kontrola
  approver_person_no: 1001      # EN: human approval in Decisions / CZ: lidské schválení v Decisions

# EN: Where the data lives. No new database engine, no new database.
# CZ: Kde data žijí. Žádný nový databázový stroj, žádná nová databáze.
storage:
  workshop:
    database: db_erp_lhutnik
    schema: dilna
  wms_extension:
    database: db_eshop
    schema: elektro_wms_dilna   # EN: Polarita extension tables only / CZ: pouze nástavbové tabulky Polarity
    vendor_tables_touched: false  # EN: never MedusaJS vendor tables / CZ: nikdy vendor tabulky MedusaJS

# EN: Rules valid for every entity below.
# CZ: Pravidla platná pro všechny entity níže.
conventions:
  optimistic_locking: version_etag   # EN: version / ETag / CZ: version / ETag
  audit_columns: [created_at, created_by_person_no, updated_at, version]
  pii_allowed: false            # EN: no names, birth numbers, contacts / CZ: žádná jména, rodná čísla, kontakty
  cross_database_links: api_only  # EN: no foreign keys across databases / CZ: žádné cizí klíče mezi databázemi
  secrets: openbao_only         # EN: no secrets in schema or code / CZ: žádná tajemství ve schématu ani v kódu
  mutations_by_ai: draft_only   # EN: ai prepares DRAFT, 1001 confirms / CZ: ai připraví DRAFT, 1001 potvrzuje

# EN: Reusable value types. / CZ: Opakovaně použitelné typy hodnot.
types:
  case_id:
    base: string
    pattern: '^POL-[0-9]{4}-[0-9]{5}$'    # EN: file number / CZ: číslo spisu POL-RRRR-NNNNN
  person_no:
    base: integer
    min: 1001                   # EN: living natural persons only / CZ: výhradně živé fyzické osoby
    max: 9999
  branch_code:
    base: string
    pattern: '^[A-Z]{2}-[1-9][0-9]{2}$'   # EN: e.g. CZ-101 / CZ: např. CZ-101
  warehouse_code:
    base: string
    pattern: '^MAIN-[1-9][0-9]{2}$'       # EN: e.g. MAIN-101 / CZ: např. MAIN-101
  station_code:
    base: string
    pattern: '^KIOSK-[1-9][0-9]{2}-[0-9]{2}$'  # EN: PROPOSAL of kiosk code / CZ: NÁVRH kódu kiosku (ke schválení 1001)
  object_key:
    base: string                # EN: Garage (S3) object key / CZ: klíč objektu v Garage (S3)

enums:
  unit_status:
    - PLANNED                   # EN: created from the file / CZ: založeno ze spisu
    - IN_ASSEMBLY               # EN: being assembled / CZ: probíhá kompletace
    - ASSEMBLED                 # EN: assembly finished / CZ: kompletace dokončena
    - IN_VERIFICATION           # EN: routine verification running / CZ: probíhá kusové ověření
    - VERIFIED_PASS             # EN: overall result VYHOVUJE / CZ: celkový výrok VYHOVUJE
    - VERIFIED_FAIL             # EN: overall result NEVYHOVUJE / CZ: celkový výrok NEVYHOVUJE
    - PASSPORT_ISSUED           # EN: passport issued, declaration signed / CZ: pas vydán, prohlášení podepsáno
    - LABELLED                  # EN: CE label printed and affixed / CZ: štítek CE vytištěn a osazen
    - RELEASED                  # EN: released to elektro-wms dispatch / CZ: uvolněno k expedici v elektro-wms
    - CANCELLED                 # EN: cancelled / CZ: zrušeno
  operation_status: [READY, RUNNING, PAUSED, DONE, CANCELLED]
  operation_event_kind: [START, PAUSE, RESUME, STOP]
  input_source: [TOUCH, SCANNER, CAMERA]   # EN: tap, USB reader, camera / CZ: dotyk, USB čtečka, kamera
  scan_method: [GS1_DATAMATRIX, GS1_128, QR, MANUAL]
  verification_status: [OPEN, IN_PROGRESS, CLOSED_PASS, CLOSED_FAIL, VOIDED]
  # EN: Document-facing verdicts stay in Czech, as on the printed protocol.
  # CZ: Výroky určené do dokumentu zůstávají česky, jako na tištěném protokolu.
  verdict: [VYHOVUJE, NEVYHOVUJE, NEPOUZIJE_SE]
  overall_verdict: [VYHOVUJE, NEVYHOVUJE]
  # EN: Routine verification points; scope and limits come from the standards
  #     register kept by 15002 (current LV switchgear standard). Temperature rise is
  #     NOT here: it is design verification by calculation (current method).
  # CZ: Body kusového ověření; rozsah a meze dává registr norem vedený 15002
  #     (platná norma pro rozváděče nízkého napětí). Oteplení zde NENÍ: jde o ověření návrhu
  #     výpočtem (podle platné metodiky).
  verification_point:
    - ENCLOSURE_PROTECTION      # EN: degree of protection of enclosure / CZ: stupeň ochrany krytem
    - CLEARANCES_CREEPAGE       # EN: clearances and creepage distances / CZ: vzdušné vzdálenosti a povrchové cesty
    - SHOCK_PROTECTION_PE       # EN: protection against electric shock, protective circuit / CZ: ochrana před úrazem, ochranný obvod PE
    - BUILT_IN_COMPONENTS       # EN: incorporation of built-in components / CZ: vestavění vestavných součástí
    - INTERNAL_CIRCUITS         # EN: internal circuits and connections / CZ: vnitřní obvody a spoje
    - EXTERNAL_TERMINALS        # EN: terminals for external conductors / CZ: svorky pro vnější vodiče
    - MECHANICAL_OPERATION      # EN: mechanical operation / CZ: mechanická funkce
    - DIELECTRIC_PROPERTIES     # EN: dielectric properties (incl. insulation resistance where allowed) / CZ: dielektrické vlastnosti (vč. izolačního odporu, kde to norma připouští)
    - WIRING_FUNCTION           # EN: wiring, operational performance and function / CZ: zapojení, pracovní charakteristiky a funkce
  verification_method: [VISUAL, MECHANICAL_CHECK, MEASUREMENT, ELECTRICAL_TEST, FUNCTION_TEST]
  # EN: REVOKED = withdrawn after the routine verification it relied on was voided.
  # CZ: REVOKED = odvoláno poté, co bylo zneplatněno kusové ověření, o které se opíralo.
  declaration_status: [DRAFT, IN_DECISIONS, SIGNED, REJECTED, REVOKED]
  label_type:
    - CE_NAMEPLATE              # EN: CE nameplate with QR / CZ: výrobní štítek CE s QR
    - PHE_BASIS                 # EN: basis for PHE recycling fee / CZ: podklad pro recyklační příspěvek PHE
  label_status: [BLOCKED, READY, PRINTED, REPRINT_REQUESTED, VOIDED]

# EN: Points that always need a calibrated instrument. The kiosk does not let
#     the worker choose a method that avoids the instrument at these points.
# CZ: Body, které vždy vyžadují kalibrované měřidlo. Kiosk u nich nedovolí
#     zvolit způsob, který měřidlo obchází.
verification_point_rules:
  instrument_required_points: [SHOCK_PROTECTION_PE, DIELECTRIC_PROPERTIES]
  instrument_methods: [MEASUREMENT, ELECTRICAL_TEST]
  # EN: NEPOUZIJE_SE is offered only where the standards register (15002) marks
  #     the point as not applicable for the product type.
  # CZ: NEPOUZIJE_SE se nabízí jen tam, kde registr norem (15002) označí bod
  #     pro daný typ výrobku jako nepoužitelný.
  not_applicable_source: registr-csn-15002

# EN: Every state machine lists its terminal states (no outgoing transition);
#     every other state must have at least one way out.
# CZ: Každý stavový automat vyjmenovává koncové stavy (bez odchozího přechodu);
#     každý jiný stav musí mít aspoň jeden výstup.

entities:

  # ---------------------------------------------------------------------------
  # EN: One manufactured switchboard (assembly) under one file.
  # CZ: Jeden vyráběný rozváděč pod jedním spisem.
  # ---------------------------------------------------------------------------
  switchboard_unit:
    storage: workshop
    table: switchboard_unit
    fields:
      id: {type: uuid, primary_key: true}
      case_id: {type: case_id, required: true, indexed: true}
      branch_code: {type: branch_code, required: true}
      warehouse_code: {type: warehouse_code, required: true}
      # EN: Factory serial number, assigned atomically by cz-sk-registry-kernel.
      # CZ: Výrobní číslo, přiděluje atomicky cz-sk-registry-kernel.
      serial_number: {type: string, required: false, unique: true, required_to_close: true}
      type_designation: {type: string, required: true}
      # EN: Bill of materials and design verification come from cad-urs-engine.
      # CZ: Kusovník a ověření návrhu pocházejí z cad-urs-engine.
      bom_ref: {type: external_ref, target: 'cad-urs-engine:bom', required: true}
      design_verification_ref: {type: external_ref, target: 'cad-urs-engine:design_verification', required: false, required_to_close: true}
      passport_ref: {type: external_ref, target: 'cad-urs-engine:passport', required: false, required_to_close: true}
      # EN: The passport whose revocation the terminal has taken over. Written only by the
      #     atomic operation revoke_passport, which in the same transaction locks every READY
      #     print job of the unit. The passport of the unit counts as revoked while this value
      #     equals passport_ref; a newly issued passport has a new reference.
      # CZ: Pas, jehož odvolání terminál převzal. Zapisuje jej jen atomická operace
      #     revoke_passport, která ve stejné transakci zamkne každou tiskovou úlohu rozváděče
      #     ve stavu READY. Pas rozváděče se považuje za odvolaný, dokud se tato hodnota
      #     rovná passport_ref; nově vydaný pas má nový odkaz.
      revoked_passport_ref: {type: external_ref, target: 'cad-urs-engine:passport', required: false}
      status: {type: enum, enum: unit_status, required: true, default: PLANNED}
      released_at: {type: timestamptz, required: false, required_when: "status = 'RELEASED'"}
    state_machine:
      field: status
      initial: PLANNED
      terminal: [CANCELLED]
      # EN: Every entry into IN_VERIFICATION works with a NEW routine_verification
      #     record; older records stay as history and are never rewritten.
      # CZ: Každý vstup do IN_VERIFICATION pracuje s NOVÝM záznamem routine_verification;
      #     starší záznamy zůstávají jako historie a nikdy se nepřepisují.
      transitions:
        - {from: PLANNED, to: IN_ASSEMBLY, action: start_assembly, guards: [bom_locked]}
        - {from: IN_ASSEMBLY, to: ASSEMBLED, action: finish_assembly, guards: [all_operations_done, all_serialized_components_scanned]}
        - {from: ASSEMBLED, to: IN_VERIFICATION, action: open_verification, guards: [design_verification_present]}
        - {from: IN_VERIFICATION, to: VERIFIED_PASS, action: close_verification_pass, guards: [verification_closed_pass]}
        - {from: IN_VERIFICATION, to: VERIFIED_FAIL, action: close_verification_fail, guards: [verification_closed_fail]}
        # EN: Verification abandoned before closing (wrong unit, interrupted test).
        # CZ: Ověření opuštěné před uzavřením (jiný rozváděč, přerušená zkouška).
        - {from: IN_VERIFICATION, to: ASSEMBLED, action: abort_verification, guards: [verification_voided, reason_recorded]}
        - {from: VERIFIED_FAIL, to: IN_ASSEMBLY, action: rework, guards: [defects_recorded]}
        # EN: The failed verification itself was wrong (wrong unit, wrong instrument, wrong
        #     criteria) and 1001 voided it: the test is repeated on a NEW record without
        #     a fictitious repair. The reason stays in void_reason of the voided record and
        #     in the Decisions item; the voided record is never deleted.
        # CZ: Chybné bylo samo nevyhovující ověření (jiný rozváděč, jiné měřidlo, jiná
        #     kritéria) a 1001 je zneplatnil: zkouška se opakuje na NOVÉM záznamu bez fiktivní
        #     opravy. Důvod zůstává ve void_reason zneplatněného záznamu a v položce Decisions;
        #     zneplatněný záznam se nikdy nemaže.
        - {from: VERIFIED_FAIL, to: IN_VERIFICATION, action: repeat_after_void, guards: [failed_verification_voided, new_verification_opened, reason_recorded, mutation_confirm_1001]}
        # EN: A closed verification was voided later: the unit goes back, whatever stage it reached.
        # CZ: Uzavřené ověření bylo později zneplatněno: rozváděč se vrací, ať došel kamkoli.
        - {from: VERIFIED_PASS, to: IN_VERIFICATION, action: reopen_after_void, guards: [verification_voided, declaration_revoked, new_verification_opened, mutation_confirm_1001]}
        - {from: PASSPORT_ISSUED, to: IN_VERIFICATION, action: invalidate_passport_after_void, guards: [verification_voided, passport_revoked, declaration_revoked, labels_voided, new_verification_opened, mutation_confirm_1001]}
        - {from: LABELLED, to: IN_VERIFICATION, action: invalidate_label_after_void, guards: [verification_voided, passport_revoked, declaration_revoked, labels_voided, new_verification_opened, mutation_confirm_1001]}
        - {from: RELEASED, to: IN_VERIFICATION, action: recall_after_void, guards: [verification_voided, unit_back_in_workshop, wms_dispatch_block_restored, passport_revoked, declaration_revoked, labels_voided, new_verification_opened, mutation_confirm_1001]}
        - {from: VERIFIED_PASS, to: PASSPORT_ISSUED, action: issue_passport, guards: [serial_number_assigned, passport_present, declaration_signed_by_1001]}
        - {from: PASSPORT_ISSUED, to: LABELLED, action: confirm_label, guards: [ce_label_printed]}
        - {from: LABELLED, to: RELEASED, action: release_to_wms, guards: [phe_basis_printed]}
        - {from: PLANNED, to: CANCELLED, action: cancel, guards: [mutation_confirm_1001]}
        - {from: IN_ASSEMBLY, to: CANCELLED, action: cancel, guards: [mutation_confirm_1001]}
        - {from: ASSEMBLED, to: CANCELLED, action: cancel, guards: [mutation_confirm_1001]}
        - {from: VERIFIED_FAIL, to: CANCELLED, action: cancel, guards: [reason_recorded, mutation_confirm_1001]}
        - {from: VERIFIED_PASS, to: CANCELLED, action: cancel, guards: [declaration_revoked, reason_recorded, mutation_confirm_1001]}
    close_requirements:           # EN: needed to reach RELEASED / CZ: nutné pro stav RELEASED
      fields: [serial_number, design_verification_ref, passport_ref]

  # ---------------------------------------------------------------------------
  # EN: One production operation on a unit (Start / Pause / Stop).
  # CZ: Jedna výrobní operace na rozváděči (Start / Pauza / Stop).
  # ---------------------------------------------------------------------------
  work_operation:
    storage: workshop
    table: work_operation
    fields:
      id: {type: uuid, primary_key: true}
      unit_id: {type: ref, ref: switchboard_unit.id, required: true}
      case_id: {type: case_id, required: true, indexed: true}
      operation_code: {type: string, required: true}   # EN: from operation catalogue / CZ: z číselníku operací
      sequence_no: {type: integer, required: true}
      person_no: {type: person_no, required: false, required_to_close: true}
      station_code: {type: station_code, required: false, required_to_close: true}
      status: {type: enum, enum: operation_status, required: true, default: READY}
      # EN: Net working time, derived from events, without pauses.
      # CZ: Čistý čas práce odvozený z událostí, bez pauz.
      net_duration_s: {type: integer, required: false, derived: true}
      note: {type: text, required: false}
    constraints:
      # EN: A person may have at most one RUNNING operation at a time, and RUNNING requires person_no.
      # CZ: Osoba smí mít v jednu chvíli nejvýše jednu operaci ve stavu RUNNING a RUNNING vyžaduje person_no.
      - {kind: check, expression: "status <> 'RUNNING' OR person_no IS NOT NULL"}
      - {kind: unique_partial, columns: [person_no], where: "status = 'RUNNING'"}
    state_machine:
      field: status
      initial: READY
      terminal: [DONE, CANCELLED]
      transitions:
        - {from: READY, to: RUNNING, action: start, guards: [person_competent, unit_in_assembly]}
        - {from: RUNNING, to: PAUSED, action: pause, guards: []}
        - {from: PAUSED, to: RUNNING, action: resume, guards: [person_competent]}
        - {from: RUNNING, to: DONE, action: stop, guards: []}
        - {from: READY, to: CANCELLED, action: cancel, guards: [reason_recorded]}
        - {from: PAUSED, to: CANCELLED, action: cancel, guards: [reason_recorded]}
    close_requirements:           # EN: needed to reach DONE / CZ: nutné pro stav DONE
      fields: [person_no, station_code]

  # ---------------------------------------------------------------------------
  # EN: Append-only log of kiosk taps and scans; never updated or deleted.
  # CZ: Neměnný deník klepnutí a pípnutí na kiosku; nikdy se nemění ani nemaže.
  # ---------------------------------------------------------------------------
  operation_event:
    storage: workshop
    table: operation_event
    append_only: true
    fields:
      id: {type: uuid, primary_key: true}
      operation_id: {type: ref, ref: work_operation.id, required: true}
      case_id: {type: case_id, required: true, indexed: true}
      kind: {type: enum, enum: operation_event_kind, required: true}
      person_no: {type: person_no, required: true}
      station_code: {type: station_code, required: true}
      source: {type: enum, enum: input_source, required: true}
      occurred_at: {type: timestamptz, required: true}   # EN: time on the kiosk / CZ: čas na kiosku
      received_at: {type: timestamptz, required: true}   # EN: time on the server / CZ: čas na serveru
      queued_offline: {type: boolean, required: true, default: false}
      idempotency_key: {type: string, required: true, unique: true}   # EN: prevents duplicate offline replays / CZ: brání duplicitnímu přehrání offline fronty

  # ---------------------------------------------------------------------------
  # EN: Serial number of a built-in device scanned into the bill of materials.
  #     Lives next to elektro-wms in db_eshop (extension tables only).
  # CZ: Sériové číslo zabudovaného přístroje naskenované do kusovníku.
  #     Žije vedle elektro-wms v db_eshop (pouze nástavbové tabulky).
  # ---------------------------------------------------------------------------
  component_scan:
    storage: wms_extension
    table: component_scan
    fields:
      id: {type: uuid, primary_key: true}
      unit_ref: {type: external_ref, target: 'dilensky-terminal:switchboard_unit', required: true}
      case_id: {type: case_id, required: true, indexed: true}
      bom_line_ref: {type: external_ref, target: 'cad-urs-engine:bom_line', required: true}
      stock_item_ref: {type: external_ref, target: 'elektro-wms:stock_item', required: true}
      gtin: {type: string, required: false}              # EN: GS1 AI 01 / CZ: GS1 AI 01
      serial_number: {type: string, required: true}      # EN: GS1 AI 21 or manual / CZ: GS1 AI 21 nebo ručně
      batch: {type: string, required: false}             # EN: GS1 AI 10 / CZ: GS1 AI 10
      scan_method: {type: enum, enum: scan_method, required: true}
      # EN: Photo of the device label is mandatory for MANUAL entries.
      # CZ: Fotografie štítku přístroje je povinná u ručního zápisu (MANUAL).
      label_photo_key: {type: object_key, required: false, required_when: "scan_method = 'MANUAL'"}
      scanned_by_person_no: {type: person_no, required: true}
      scanned_at: {type: timestamptz, required: true}
    constraints:
      # EN: One device serial number may sit in one switchboard only (PostgreSQL UNIQUE NULLS NOT DISTINCT).
      # CZ: Jedno sériové číslo přístroje smí být jen v jednom rozváděči (PostgreSQL UNIQUE NULLS NOT DISTINCT).
      - {kind: unique, nulls_distinct: false, columns: [gtin, serial_number]}
      - {kind: unique, columns: [bom_line_ref, serial_number]}

  # ---------------------------------------------------------------------------
  # EN: Routine verification of one unit (header of the checklist).
  # CZ: Kusové ověření jednoho rozváděče (hlavička checklistu).
  # ---------------------------------------------------------------------------
  routine_verification:
    storage: workshop
    table: routine_verification
    fields:
      id: {type: uuid, primary_key: true}
      unit_id: {type: ref, ref: switchboard_unit.id, required: true}
      case_id: {type: case_id, required: true, indexed: true}
      # EN: Version of the standards register (15002) used for criteria.
      # CZ: Verze registru norem (15002), ze které se berou kritéria.
      standards_register_ref: {type: external_ref, target: 'registr-csn-15002:version', required: true, required_to_close: true}
      design_verification_ref: {type: external_ref, target: 'cad-urs-engine:design_verification', required: true, required_to_close: true}
      # EN: Product part of the standard, taken from the register, never typed by hand.
      # CZ: Výrobková část normy, bere se z registru, nikdy se nepíše ručně.
      product_standard_ref: {type: external_ref, target: 'registr-csn-15002:product_standard', required: false, required_to_close: true}
      opened_at: {type: timestamptz, required: true}
      station_code: {type: station_code, required: false, required_to_close: true}
      verifier_person_no: {type: person_no, required: true, required_to_close: true}
      # EN: Snapshot of the ZPUSOBILY gate from portal-spolupracovniku (Clean Room).
      # CZ: Otisk stavu ZPŮSOBILÝ z portal-spolupracovniku (Clean Room).
      verifier_competent: {type: boolean, required: false, required_to_close: true}
      competence_checked_at: {type: timestamptz, required: false, required_to_close: true}
      status: {type: enum, enum: verification_status, required: true, default: OPEN}
      overall_verdict: {type: enum, enum: overall_verdict, required: false, required_to_close: true}
      closed_at: {type: timestamptz, required: false, required_to_close: true}
      void_reason: {type: text, required: false, required_when: "status = 'VOIDED'"}
    constraints:
      # EN: At most one running verification per unit; a repeated verification is a new record.
      # CZ: Nejvýše jedno běžící ověření na rozváděč; opakované ověření je nový záznam.
      - {kind: unique_partial, columns: [unit_id], where: "status IN ('OPEN', 'IN_PROGRESS')"}
      # EN: Hard-Stop in the database, not only in the guard: a closed record carries
      #     competence = true and a verdict that matches the closing state.
      # CZ: Hard-Stop i v databázi, nejen v zámku: uzavřený záznam nese způsobilost = true
      #     a výrok odpovídající stavu uzavření.
      - {kind: check, expression: "status NOT IN ('CLOSED_PASS', 'CLOSED_FAIL') OR verifier_competent IS TRUE"}
      - {kind: check, expression: "status <> 'CLOSED_PASS' OR (overall_verdict IS NOT NULL AND overall_verdict = 'VYHOVUJE')"}
      - {kind: check, expression: "status <> 'CLOSED_FAIL' OR (overall_verdict IS NOT NULL AND overall_verdict = 'NEVYHOVUJE')"}
    state_machine:
      field: status
      initial: OPEN
      terminal: [VOIDED]
      transitions:
        - {from: OPEN, to: IN_PROGRESS, action: begin, guards: [person_competent, design_verification_present]}
        - {from: IN_PROGRESS, to: CLOSED_PASS, action: close_pass, guards: [all_points_have_verdict, no_point_nevyhovuje, instrument_points_measured, not_applicable_allowed_by_register, instruments_calibrated_on_test_day, person_competent, online_with_server]}
        - {from: IN_PROGRESS, to: CLOSED_FAIL, action: close_fail, guards: [all_points_have_verdict, some_point_nevyhovuje, defects_recorded, instrument_points_measured, not_applicable_allowed_by_register, instruments_calibrated_on_test_day, person_competent, online_with_server]}
        # EN: Abandoning an unfinished verification needs only a reason; nothing was issued yet.
        # CZ: Opuštění nedokončeného ověření vyžaduje jen důvod; nic ještě nebylo vydáno.
        - {from: OPEN, to: VOIDED, action: abort, guards: [reason_recorded]}
        - {from: IN_PROGRESS, to: VOIDED, action: abort, guards: [reason_recorded]}
        # EN: Voiding a passed verification never runs alone: in the same atomic operation
        #     every READY print job of the unit is locked again (see `atomic_operations`).
        # CZ: Zneplatnění vyhovujícího ověření nikdy neběží samo: ve stejné atomické operaci
        #     se znovu zamkne každá tisková úloha rozváděče ve stavu READY (viz `atomic_operations`).
        - {from: CLOSED_PASS, to: VOIDED, action: void, atomic: void_passed_verification, guards: [mutation_confirm_1001, reason_recorded]}
        - {from: CLOSED_FAIL, to: VOIDED, action: void, guards: [mutation_confirm_1001, reason_recorded]}
    close_requirements:           # EN: needed for CLOSED_PASS / CLOSED_FAIL / CZ: nutné pro CLOSED_PASS / CLOSED_FAIL
      fields: [standards_register_ref, design_verification_ref, product_standard_ref, station_code, verifier_person_no, verifier_competent, competence_checked_at, overall_verdict, closed_at]

  # ---------------------------------------------------------------------------
  # EN: One point of the routine verification checklist.
  # CZ: Jeden bod checklistu kusového ověření.
  # ---------------------------------------------------------------------------
  verification_item:
    storage: workshop
    table: verification_item
    fields:
      id: {type: uuid, primary_key: true}
      verification_id: {type: ref, ref: routine_verification.id, required: true}
      case_id: {type: case_id, required: true, indexed: true}
      point: {type: enum, enum: verification_point, required: true}
      method: {type: enum, enum: verification_method, required: true}
      verdict: {type: enum, enum: verdict, required: false, required_to_close: true}
      # EN: Measured value as exact decimal; the limit comes from the register.
      # CZ: Naměřená hodnota jako přesné desetinné číslo; mez dává registr.
      measured_value: {type: decimal, required: false, required_when: "method IN ('MEASUREMENT', 'ELECTRICAL_TEST') AND verdict IN ('VYHOVUJE', 'NEVYHOVUJE')"}
      measured_unit: {type: string, required: false, required_when: "method IN ('MEASUREMENT', 'ELECTRICAL_TEST') AND verdict IN ('VYHOVUJE', 'NEVYHOVUJE')"}
      criterion_ref: {type: external_ref, target: 'registr-csn-15002:criterion', required: false, required_to_close: true}
      # EN: Instrument from the Lhutnik calendar; mandatory for measurements.
      # CZ: Měřidlo z Lhůtníku; povinné u měření a elektrických zkoušek.
      instrument_ref: {type: external_ref, target: 'centralni-lhutnik-a-objekty:asset', required: false, required_when: "method IN ('MEASUREMENT', 'ELECTRICAL_TEST') AND verdict IN ('VYHOVUJE', 'NEVYHOVUJE')"}
      calibration_valid_until: {type: date, required: false, required_when: "method IN ('MEASUREMENT', 'ELECTRICAL_TEST') AND verdict IN ('VYHOVUJE', 'NEVYHOVUJE')"}
      calibration_certificate_ref: {type: external_ref, target: 'centralni-lhutnik-a-objekty:calibration', required: false, required_when: "method IN ('MEASUREMENT', 'ELECTRICAL_TEST') AND verdict IN ('VYHOVUJE', 'NEVYHOVUJE')"}
      performed_by_person_no: {type: person_no, required: false, required_to_close: true}
      performed_at: {type: timestamptz, required: false, required_to_close: true}
      # EN: Explicit Europe/Prague calendar date so the CHECK constraint stays IMMUTABLE in PostgreSQL;
      #     the server derives it from performed_at, the kiosk never sends it.
      # CZ: Explicitní datum v pásmu Europe/Prague, aby CHECK omezení zůstalo v PostgreSQL IMMUTABLE;
      #     odvozuje je server z performed_at, kiosk je nikdy neposílá.
      performed_on: {type: date, required: false, required_to_close: true}
      defect_note: {type: text, required: false, required_when: "verdict = 'NEVYHOVUJE'"}
      not_applicable_reason: {type: text, required: false, required_when: "verdict = 'NEPOUZIJE_SE'"}
      photo_keys: {type: json, required: false}          # EN: list of Garage keys / CZ: seznam klíčů v Garage
    constraints:
      - {kind: unique, columns: [verification_id, point]}
      # EN: Hard-Stop: calibration must be valid on the day of the test (IMMUTABLE date check).
      # CZ: Hard-Stop: kalibrace musí platit v den zkoušky (IMMUTABLE kontrola data).
      # EN: A missing calibration date or test date does NOT pass.
      # CZ: Chybějící datum kalibrace nebo datum zkoušky NEprojde.
      - {kind: check, expression: "verdict IS NULL OR verdict = 'NEPOUZIJE_SE' OR method NOT IN ('MEASUREMENT', 'ELECTRICAL_TEST') OR (performed_on IS NOT NULL AND calibration_valid_until IS NOT NULL AND calibration_valid_until >= performed_on)"}
      # EN: Points from verification_point_rules cannot be closed by a method without an instrument.
      # CZ: Body z verification_point_rules nelze uzavřít způsobem bez měřidla.
      - {kind: check, expression: "verdict IS NULL OR verdict = 'NEPOUZIJE_SE' OR point NOT IN ('SHOCK_PROTECTION_PE', 'DIELECTRIC_PROPERTIES') OR method IN ('MEASUREMENT', 'ELECTRICAL_TEST')"}
    close_requirements:           # EN: needed before the header can close / CZ: nutné před uzavřením hlavičky
      fields: [verdict, criterion_ref, performed_by_person_no, performed_at, performed_on]

  # ---------------------------------------------------------------------------
  # EN: EU declaration of conformity: ai drafts, a human (1001) signs.
  # CZ: EU prohlášení o shodě: ai připraví návrh, podepisuje člověk (1001).
  # ---------------------------------------------------------------------------
  declaration_of_conformity:
    storage: workshop
    table: declaration_of_conformity
    fields:
      id: {type: uuid, primary_key: true}
      unit_id: {type: ref, ref: switchboard_unit.id, required: true}
      # EN: The verification this declaration relies on; a new verification needs a new declaration.
      # CZ: Ověření, o které se prohlášení opírá; nové ověření vyžaduje nové prohlášení.
      verification_id: {type: ref, ref: routine_verification.id, required: true}
      case_id: {type: case_id, required: true, indexed: true}
      draft_pdf_key: {type: object_key, required: true}  # EN: DRAFT from cad-urs-engine / CZ: DRAFT z cad-urs-engine
      status: {type: enum, enum: declaration_status, required: true, default: DRAFT}
      decisions_ref: {type: external_ref, target: 'decisions:item', required: false, required_to_close: true}
      # EN: Must be a human; an ai number (5 digits) is rejected by the type.
      # CZ: Musí být člověk; číslo ai (5 cifer) typ odmítne.
      signed_by_person_no: {type: person_no, required: false, required_to_close: true, allowed_values: [1001]}
      signed_at: {type: timestamptz, required: false, required_to_close: true}
      signed_pdf_key: {type: object_key, required: false, required_to_close: true}
      reject_reason: {type: text, required: false, required_when: "status = 'REJECTED'"}
      revoke_reason: {type: text, required: false, required_when: "status = 'REVOKED'"}
    constraints:
      # EN: One live declaration per unit; revoked ones stay as history.
      # CZ: Jedno živé prohlášení na rozváděč; odvolaná zůstávají jako historie.
      - {kind: unique_partial, columns: [unit_id], where: "status <> 'REVOKED'"}
    state_machine:
      field: status
      initial: DRAFT
      terminal: [REVOKED]
      transitions:
        - {from: DRAFT, to: IN_DECISIONS, action: submit, guards: [verification_closed_pass, judge_15002_pass]}
        - {from: IN_DECISIONS, to: SIGNED, action: sign, guards: [verification_closed_pass, mutation_confirm_1001, qes_signature_present]}
        - {from: IN_DECISIONS, to: REJECTED, action: reject, guards: [reason_recorded]}
        - {from: REJECTED, to: DRAFT, action: redraft, guards: []}
        # EN: The verification behind the declaration was voided: the declaration is revoked, never edited.
        # CZ: Ověření, o které se prohlášení opírá, bylo zneplatněno: prohlášení se odvolá, nikdy neupravuje.
        - {from: DRAFT, to: REVOKED, action: revoke, guards: [verification_voided, reason_recorded]}
        - {from: IN_DECISIONS, to: REVOKED, action: revoke, guards: [verification_voided, reason_recorded]}
        - {from: REJECTED, to: REVOKED, action: revoke, guards: [verification_voided, reason_recorded]}
        # EN: A SIGNED declaration is a basis of the print, so its revocation never runs alone:
        #     in the same atomic operation every READY print job of the unit is locked again
        #     (see `atomic_operations`). An unsigned declaration is not a basis of any print.
        # CZ: Prohlášení ve stavu SIGNED je podkladem tisku, proto jeho odvolání nikdy neběží
        #     samo: ve stejné atomické operaci se znovu zamkne každá tisková úloha rozváděče
        #     ve stavu READY (viz `atomic_operations`). Nepodepsané prohlášení podkladem
        #     žádného tisku není.
        - {from: SIGNED, to: REVOKED, action: revoke_signed, atomic: revoke_signed_declaration, guards: [verification_voided, reason_recorded, mutation_confirm_1001]}
    close_requirements:           # EN: needed for SIGNED / CZ: nutné pro stav SIGNED
      fields: [decisions_ref, signed_by_person_no, signed_at, signed_pdf_key]

  # ---------------------------------------------------------------------------
  # EN: Print job of the CE nameplate or the PHE basis.
  # CZ: Tisková úloha štítku CE nebo podkladu PHE.
  # ---------------------------------------------------------------------------
  label_print_job:
    storage: workshop
    table: label_print_job
    fields:
      id: {type: uuid, primary_key: true}
      unit_id: {type: ref, ref: switchboard_unit.id, required: true}
      case_id: {type: case_id, required: true, indexed: true}
      label_type: {type: enum, enum: label_type, required: true}
      status: {type: enum, enum: label_status, required: true, default: BLOCKED}
      template_version: {type: string, required: false, required_to_close: true}   # EN: Typst template / CZ: šablona Typst
      payload_hash: {type: string, required: false, required_to_close: true}       # EN: hash of printed data / CZ: otisk tištěných dat
      printed_by_person_no: {type: person_no, required: false, required_to_close: true}
      printed_at: {type: timestamptz, required: false, required_to_close: true}
      station_code: {type: station_code, required: false, required_to_close: true}
      copies: {type: integer, required: false, default: 1}
      reprint_reason: {type: text, required: false, required_when: "status = 'REPRINT_REQUESTED'"}
      void_reason: {type: text, required: false, required_when: "status = 'VOIDED'"}
    constraints:
      # EN: One live job per unit and label type; voided jobs stay as history.
      # CZ: Jedna živá úloha na rozváděč a typ štítku; zneplatněné úlohy zůstávají jako historie.
      - {kind: unique_partial, columns: [unit_id, label_type], where: "status <> 'VOIDED'"}
    state_machine:
      field: status
      initial: BLOCKED
      terminal: [VOIDED]
      transitions:
        # EN: READY alone proves nothing about today: unlocking, EVERY print and every approved
        #     reprint check the current basis again (print_basis_current) at the moment of
        #     the action.
        # CZ: Samotný stav READY o dnešku nic nedokazuje: odemčení, KAŽDÝ tisk i každý schválený
        #     přetisk znovu ověřují aktuální podklady (print_basis_current) v okamžiku akce.
        - {from: BLOCKED, to: READY, action: unlock, guards: [print_basis_current]}
        - {from: READY, to: PRINTED, action: print, guards: [online_with_server, print_basis_current]}
        # EN: The basis fell while the job was waiting: the job is locked again. The relock is
        #     never a separate step and is never offered on its own: it runs only as a member
        #     of the atomic operation that takes the basis away — void_passed_verification,
        #     revoke_signed_declaration or revoke_passport (see `atomic_operations`). Whichever
        #     basis falls, no job of the unit is READY once that operation is committed.
        # CZ: Podklady padly, zatímco úloha čekala: úloha se znovu zamkne. Zamčení není nikdy
        #     samostatný krok a samostatně se nenabízí: běží jen jako člen atomické operace,
        #     která podklad odebírá — void_passed_verification, revoke_signed_declaration nebo
        #     revoke_passport (viz `atomic_operations`). Ať padne kterýkoli podklad, po
        #     potvrzení té operace není žádná úloha rozváděče ve stavu READY.
        - {from: READY, to: BLOCKED, action: relock, guards: [print_basis_lost]}
        - {from: PRINTED, to: REPRINT_REQUESTED, action: request_reprint, guards: [reason_recorded]}
        - {from: REPRINT_REQUESTED, to: READY, action: approve_reprint, guards: [mutation_confirm_1001, print_basis_current]}
        - {from: REPRINT_REQUESTED, to: PRINTED, action: reject_reprint, guards: [reason_recorded, mutation_confirm_1001]}
        # EN: A printed label is voided when the verification or passport behind it falls.
        # CZ: Vytištěný štítek se zneplatní, když padne ověření nebo pas, o které se opírá.
        - {from: PRINTED, to: VOIDED, action: void_printed, guards: [reason_recorded, mutation_confirm_1001]}
        - {from: REPRINT_REQUESTED, to: VOIDED, action: void_printed, guards: [reason_recorded, mutation_confirm_1001]}
        - {from: BLOCKED, to: VOIDED, action: void, guards: [reason_recorded]}
        - {from: READY, to: VOIDED, action: void, guards: [reason_recorded]}
    close_requirements:           # EN: needed for PRINTED / CZ: nutné pro stav PRINTED
      fields: [template_version, payload_hash, printed_by_person_no, printed_at, station_code]

# EN: Atomic operations: the server runs all members in ONE transaction — it locks the
#     rows, evaluates the guards of all member transitions over the state BEFORE the
#     operation, writes all new states, and writes nothing if any step fails.
#     `each: true` = the member applies to every row of the unit that is in the `from`
#     state at that moment (possibly none).
# CZ: Atomické operace: server provede všechny členy v JEDNÉ transakci — zamkne řádky,
#     vyhodnotí zámky všech členských přechodů nad stavem PŘED operací, zapíše všechny nové
#     stavy, a selže-li kterýkoli krok, nezapíše nic. `each: true` = člen platí pro každý
#     řádek rozváděče, který je v tom okamžiku ve stavu `from` (i žádný).
# EN: `set:` = the member writes the listed field of the unit instead of switching a state;
#     its `guards` are evaluated like the guards of a transition.
# CZ: `set:` = člen místo přepnutí stavu zapíše uvedené pole rozváděče; jeho `guards` se
#     vyhodnocují stejně jako zámky přechodu.
atomic_operations:
  operations:
    # EN: The print has three bases: the passed verification, the signed declaration and the
    #     passport. Taking ANY of them away is one of the three operations below and each
    #     of them locks the READY jobs in the same transaction. After the operation no print
    #     job of the unit is READY, so nothing can be printed from a job released earlier.
    #     Jobs already PRINTED are handled by labels_voided.
    # CZ: Tisk má tři podklady: vyhovující ověření, podepsané prohlášení a pas. Odebrání
    #     KTERÉHOKOLI z nich je jedna ze tří operací níže a každá ve stejné transakci zamkne
    #     úlohy ve stavu READY. Po operaci není žádná tisková úloha rozváděče READY, takže
    #     z dříve uvolněné úlohy nelze nic vytisknout. Již vytištěné úlohy řeší zámek
    #     labels_voided.
    void_passed_verification:
      members:
        - {entity: routine_verification, from: CLOSED_PASS, to: VOIDED, action: void}
        - {entity: label_print_job, each: true, from: READY, to: BLOCKED, action: relock}
    revoke_signed_declaration:
      members:
        - {entity: declaration_of_conformity, from: SIGNED, to: REVOKED, action: revoke_signed}
        - {entity: label_print_job, each: true, from: READY, to: BLOCKED, action: relock}
    # EN: The passport itself lives in cad-urs-engine, outside this database. The terminal
    #     takes its revocation over by this operation: it records the revoked passport on
    #     the unit and locks the READY jobs in one transaction. Until then the print is
    #     still stopped by print_basis_current, which asks cad-urs-engine at every print.
    # CZ: Samotný pas žije v cad-urs-engine, mimo tuto databázi. Terminál jeho odvolání
    #     přebírá touto operací: v jedné transakci zapíše odvolaný pas k rozváděči a zamkne
    #     úlohy ve stavu READY. Do té doby tisk i tak zastaví zámek print_basis_current,
    #     který se cad-urs-engine ptá při každém tisku.
    revoke_passport:
      members:
        - {entity: switchboard_unit, set: {revoked_passport_ref: passport_ref}, action: record_passport_revocation, guards: [passport_revoked_at_source, reason_recorded, mutation_confirm_1001]}
        - {entity: label_print_job, each: true, from: READY, to: BLOCKED, action: relock}

# EN: Named guards used in the state machines above. Each is evaluated on the
#     server, never only in the kiosk browser.
# CZ: Pojmenované zámky použité ve stavových automatech výše. Každý se
#     vyhodnocuje na serveru, nikdy jen v prohlížeči kiosku.
guards:
  bom_locked: "EN: bill of materials is approved in cad-urs-engine / CZ: kusovník je schválen v cad-urs-engine"
  all_operations_done: "EN: every work_operation is DONE or CANCELLED / CZ: všechny operace jsou DONE nebo CANCELLED"
  all_serialized_components_scanned: "EN: every serialized BOM line has a component_scan / CZ: každý řádek kusovníku s povinným S/N má component_scan"
  design_verification_present: "EN: design verification incl. temperature rise by calculation exists / CZ: existuje ověření návrhu vč. oteplení výpočtem"
  person_competent: "EN: portal-spolupracovniku returns ZPUSOBILY ANO for the person / CZ: portal-spolupracovniku vrací pro osobu ZPŮSOBILÝ: ANO"
  unit_in_assembly: "EN: unit status is IN_ASSEMBLY / CZ: rozváděč je ve stavu IN_ASSEMBLY"
  all_points_have_verdict: "EN: all nine points have a verdict / CZ: všech devět bodů má výrok"
  instrument_points_measured: "EN: every point listed in verification_point_rules with a verdict other than NEPOUZIJE_SE uses MEASUREMENT or ELECTRICAL_TEST with a scanned instrument and a stored value / CZ: každý bod z verification_point_rules s jiným výrokem než NEPOUZIJE_SE používá MEASUREMENT nebo ELECTRICAL_TEST s naskenovaným měřidlem a zapsanou hodnotou"
  not_applicable_allowed_by_register: "EN: every NEPOUZIJE_SE verdict is permitted for the product type by the standards register (15002) and has a written reason; all nine points can never be NEPOUZIJE_SE / CZ: každý výrok NEPOUZIJE_SE připouští pro daný typ výrobku registr norem (15002) a má písemné zdůvodnění; všech devět bodů nikdy nemůže být NEPOUZIJE_SE"
  no_point_nevyhovuje: "EN: no point has NEVYHOVUJE / CZ: žádný bod nemá NEVYHOVUJE"
  some_point_nevyhovuje: "EN: at least one point has NEVYHOVUJE / CZ: aspoň jeden bod má NEVYHOVUJE"
  defects_recorded: "EN: every failed point has a defect note / CZ: každý nevyhovující bod má popis závady"
  instruments_calibrated_on_test_day: "EN: every used instrument has a valid calibration in Lhutnik on the test day / CZ: každé použité měřidlo má v den zkoušky platnou kalibraci v Lhůtníku"
  online_with_server: "EN: no closing or printing from the offline queue / CZ: žádné uzavření ani tisk z offline fronty"
  verification_closed_pass: "EN: latest routine_verification of the unit is CLOSED_PASS (not VOIDED) / CZ: poslední kusové ověření rozváděče je CLOSED_PASS (není VOIDED)"
  verification_closed_fail: "EN: latest routine_verification is CLOSED_FAIL / CZ: poslední kusové ověření je CLOSED_FAIL"
  print_basis_current: "EN: at the moment of the action: the latest routine_verification of the unit is CLOSED_PASS (not VOIDED), the passport from cad-urs-engine is sealed and not revoked (neither in cad-urs-engine nor by revoked_passport_ref of the unit), and the live (not REVOKED) declaration_of_conformity relies on that verification and is SIGNED by person 1001 / CZ: v okamžiku akce: poslední kusové ověření rozváděče je CLOSED_PASS (není VOIDED), pas z cad-urs-engine je opatřen pečetí a není zneplatněn (v cad-urs-engine ani polem revoked_passport_ref rozváděče) a živé (ne REVOKED) prohlášení o shodě se o toto ověření opírá a je SIGNED osobou 1001"
  print_basis_lost: "EN: the transition runs as a member of the atomic operation that takes a basis of the print away (void_passed_verification, revoke_signed_declaration, revoke_passport); it is never offered on its own / CZ: přechod běží jako člen atomické operace, která odebírá podklad tisku (void_passed_verification, revoke_signed_declaration, revoke_passport); samostatně se nikdy nenabízí"
  failed_verification_voided: "EN: the routine_verification that put the unit into VERIFIED_FAIL is VOIDED with a void_reason confirmed by 1001 / CZ: kusové ověření, které rozváděč převedlo do VERIFIED_FAIL, je VOIDED s důvodem void_reason potvrzeným 1001"
  verification_voided: "EN: referenced routine_verification transitioned to VOIDED / CZ: navázané kusové ověření přešlo do VOIDED"
  new_verification_opened: "EN: a new routine_verification in OPEN exists for the unit / CZ: pro rozváděč existuje nový záznam kusového ověření ve stavu OPEN"
