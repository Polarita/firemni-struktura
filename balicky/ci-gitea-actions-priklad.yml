# Example Gitea Actions workflow for the Polarita blueprint (Blocks 13-15 + consistency check).
# Vzorový workflow Gitea Actions pro návrh Polarita (Bloky 13–15 + kontrola konzistence).
#
# EN: After installing Gitea inside polarita-hq in Block 5, copy this template to
#     .gitea/workflows/kontrola.yml and record the first successful run in Gitea.
# CZ: Po instalaci Gitea uvnitř polarita-hq v Bloku 5 zkopíruj tuto šablonu do
#     .gitea/workflows/kontrola.yml a ulož záznam o prvním úspěšném běhu v Gitea.
name: kontrola-navrhu
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    # EN: Because the runner runs in host mode inside a shared Incus container without per-job isolation,
    #     run CI only on trusted internal branches or inside an ephemeral Incus runner container.
    # CZ: Protože runner běží v režimu host ve sdíleném kontejneru Incus bez izolace mezi joby,
    #     spouštěj CI jen na důvěryhodných interních větvích nebo v efemérním kontejneru runneru.
    branches: [main]

jobs:
  kontrola:
    # The runner (act_runner) is registered in HOST mode inside an Incus system container in the zone
    # app_internal with the label "polarita-incus:host" - jobs run directly in that container, never in Docker.
    # Runner (act_runner) je registrován v režimu HOST uvnitř systémového kontejneru Incus v zóně
    # app_internal se štítkem "polarita-incus:host" - úlohy běží přímo v tomto kontejneru, nikdy v Dockeru.
    runs-on: polarita-incus
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # EN: A missing Chromium browser is a FAILURE here, not a skipped test (S1 print tests, S3 kernel test).
      # CZ: Chybějící prohlížeč Chromium je zde SELHÁNÍ, ne přeskočený test (tiskové testy S1, test jádra S3).
      POLARITA_REQUIRE_BROWSER: "1"
    steps:
      # EN: Runner rules: a dedicated gitea-runner instance in the zone app_internal, host mode (no Docker),
      #     no access to production secrets (this workflow uses none - never add a secret or a live
      #     endpoint here), workflow files are protected (only 1001 / 17004 change them).
      #     The runner container needs git, python3 (3.10 or newer), python3-venv, a Chromium browser and
      #     a pre-staged offline wheelhouse in /opt/polarita-wheels (built during Block 5 image setup
      #     in the build instance in dmz_edge - a verified step of Block 5; the runner has no outbound traffic, only the local Gitea). For the same reason the workflow uses NO marketplace
      #     action ("uses:"): an action would have to be downloaded from the internet. The sources are
      #     fetched by plain git from the local Gitea with the short-lived token of this very job.
      # CZ: Pravidla runneru: vyhrazená instance gitea-runner v zóně app_internal, režim host (bez Dockeru),
      #     bez přístupu k produkčním tajemstvím (tento workflow žádné nepoužívá - nikdy sem nepřidávej
      #     tajemství ani živý endpoint), workflow soubory jsou chráněné (mění je jen 1001 / 17004).
      #     Kontejner runneru potřebuje git, python3 (3.10 nebo novější), python3-venv, prohlížeč Chromium
      #     a předem uložený offline wheelhouse v /opt/polarita-wheels (připravený při stavbě obrazu
      #     v sestavovací instanci v dmz_edge - ověřený krok Bloku 5; runner nemá žádný odchozí provoz, jen místní Gitea). Ze stejného důvodu workflow NEPOUŽÍVÁ žádnou akci z tržiště
      #     ("uses:"): akce by se musela stáhnout z internetu. Zdrojové soubory si bere prostým gitem
      #     z místní Gitea krátkodobým tokenem právě této úlohy.
      - name: Checkout by local git (no marketplace action) / Checkout místním gitem (bez akce z tržiště)
        env:
          POLARITA_JOB_TOKEN: ${{ github.token }}
        run: |
          test -z "$(ls -A .)" || { echo "workspace is not empty / pracovní složka není prázdná"; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$POLARITA_JOB_TOKEN" | base64 | tr -d '\n')"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c "http.extraheader=Authorization: Basic $AUTH" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      # EN: The venv and all run outputs live in a fresh temporary folder outside the checkout: no fixed
      #     path that another job or user could prepare in advance, nothing that pollutes git status.
      # CZ: Venv i všechny výstupy běhu žijí v nové dočasné složce mimo checkout: žádná pevná cesta, kterou
      #     by mohl předem připravit jiný job či uživatel, nic, co by zanášelo git status.
      - name: Python dependencies (offline wheelhouse) / Závislosti (offline)
        run: |
          WORK="$(mktemp -d)"
          python3 -c "import sys; assert sys.version_info >= (3, 10), sys.version"
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/pip" install --no-index --find-links=/opt/polarita-wheels -r balicky/S1-generator-cistopisu/requirements.txt
          echo "POLARITA_CI_WORK=$WORK" >> "$GITHUB_ENV"
          echo "$WORK/venv/bin" >> "$GITHUB_PATH"

      - name: Consistency check against the canon / Kontrola konzistence proti kanonu
        working-directory: nastroje
        run: |
          python3 sync_prompt_core.py --check
          python3 check_consistency.py
          python3 -m unittest test_check_consistency

      # EN: Stage 1 in Gitea CI = this deterministic run WITHOUT any model call: a dry-run of the S2 set
      #     (the 20 base scenarios and the extended ones) against the reference policy. It checks the
      #     safeguards of the policy against the expectations of the set - not the behaviour of a language
      #     model or of a changed system prompt. Promptfoo and every run with a model are NOT part of CI:
      #     17005 starts them outside the runner (the runner has no outbound traffic and no model keys).
      # CZ: Stage 1 v Gitea CI = tento deterministický běh BEZ volání modelu: dry-run sady S2
      #     (20 základních scénářů i rozšířené) proti referenční politice. Ověřuje pojistky politiky
      #     proti očekáváním sady - ne chování jazykového modelu ani změněného systémového promptu.
      #     Promptfoo ani žádný běh s modelem NEJSOU součástí CI: spouští je 17005 mimo runner
      #     (runner nemá odchozí provoz ani klíče k API modelů).
      - name: AigisCode – statická kontrola architektury
        run: |
          (cd /opt/polarita-aigis && sha256sum -c --status SHA256SUMS)
          /usr/bin/python3 -I /opt/polarita-aigis/kontrola.py "$PWD"

      - name: S2 Eval Suite 100+ (dry-run policy check must be 100 %) / dry-run politiky musí být 100 %
        working-directory: balicky/S2-eval-suite
        run: |
          python3 -m unittest test_eval_suite
          python3 run_eval_suite.py --mode dry-run --suite base --no-history --out-dir "$POLARITA_CI_WORK/eval-stage1" --audio-dir "$POLARITA_CI_WORK/eval-audio"
          python3 -c 'import glob,json,os; (path,)=glob.glob(os.environ["POLARITA_CI_WORK"]+"/eval-stage1/*.json"); r=json.load(open(path)); assert (r["verdict"],r["total"],r["passed"],r["evidence"])==("VERIFIED_PASS",20,20,"REFERENCE_POLICY")'
          python3 run_eval_suite.py --no-history --out-dir "$POLARITA_CI_WORK/eval-out" --audio-dir "$POLARITA_CI_WORK/eval-audio"

      - name: S3 pricing kernel & build sync / Cenové jádro a shoda sestavení
        working-directory: balicky/S3-konfigurator-a-tarify
        run: |
          python3 pricing.py --build
          git diff --exit-code .
          python3 -m unittest test_pricing

      - name: S1 templates, sample data and print / Šablony, vzorová data a tisk
        working-directory: balicky/S1-generator-cistopisu
        # EN: --check validates templates and data; the unit tests print real PDFs into a temporary folder.
        # CZ: --check ověří šablony a data; jednotkové testy tisknou skutečná PDF do dočasné složky.
        run: |
          python3 generate_pdfs.py --check
          python3 -m unittest test_generate_pdfs

      - name: Engineering formulas / Připnuté výpočty a metodiky TEST
        run: |
          sha256sum --strict -c - <<'OTISKY'
          c74f2f6315178cea6a962c405804be19b35b9592383c3cf170155eaa30f1c6ec  nasazeni/test/inzenyring/rozvadece/teplota.py
          8358a8bc60b729422cdfb879417a9ee38a966e69879761450e64d1ed1c9e3331  nasazeni/test/inzenyring/rozvadece/metodika-test.json
          2753568d3f9e80a2a63e7e0b9faa8647b5fca14e0fca2d003dfe3dfb9f76329c  nasazeni/test/inzenyring/revize/posouzeni.py
          9f9713d6978c344c7c096a198cfb4ce2c09aade8ce94f58e925f9a6876e405db  nasazeni/test/metadata-schema-kernel/vykop.py
          7a5965a09aab83e8aeca142a0181a1490cf3e22190e6dede4eb8d4f6dfb7612d  nasazeni/test/inzenyring/vzor/metodika.json
          d5980e98d71ecca8d338874b282a7dedb005a9218307f948dda52c74e6f8098a  nasazeni/test/metadata-schema-kernel/dlm.py
          469465858b58f27bc8f4f4a6470f1125758cd6d13ca6bf553520ad85bccb88fc  nasazeni/test/metadata-schema-kernel/dlm-metodiky-test.json
          9c8b5f834f54142125c4210167f538f0bd60aab513824b583c4715641a84a5be  nasazeni/test/metadata-schema-kernel/dlm-projekty-test.json
          ac089e7d2a0172fa273398523d8406414c065aeca6a79ac5c27c9500b02a27ca  nasazeni/test/inzenyring/test_dlm.py
          OTISKY
          python3 -m unittest discover -s nasazeni/test/inzenyring -p test_dlm.py
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("nasazeni/test/inzenyring/rozvadece").resolve()))
          from pas import model
          result = model()["teplo"]
          assert result == {"ztrata_W":"96","stred_K":"18","vrch_K":"24","uvnitr_C":"59","mez_C":"60"}, result
          PY

      - name: Working tree must stay clean / Pracovní strom musí zůstat čistý
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: Remove the temporary folder / Úklid dočasné složky
        if: always()
        run: |
          case "$POLARITA_CI_WORK" in
            /*) rm -rf -- "$POLARITA_CI_WORK" ;;
          esac
