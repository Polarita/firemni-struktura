server {
    listen 10.239.32.24:8080;
    root /opt/polarita-akademie/current/public;
    index index.php;
    server_tokens off;
    access_log off;
    client_max_body_size 24m;
    allow 10.239.31.10;
    allow 10.239.32.1;
    deny all;

    location ~ /\. { return 404; }
    location / {
        try_files $uri $uri/ /r.php$is_args$args;
    }
    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $moodle_path_info $fastcgi_path_info;
        try_files $fastcgi_script_name /r.php$is_args$args;
        include /etc/nginx/polarita-akademie-fastcgi.conf;
        fastcgi_param PATH_INFO $moodle_path_info;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 300s;
    }
}
