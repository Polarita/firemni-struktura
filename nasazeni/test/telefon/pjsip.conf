[global]
type=global
user_agent=Polarita-TEST

[linka-a]
type=transport
protocol=udp
bind=127.0.0.2:15060

[linka-b]
type=transport
protocol=udp
bind=127.0.0.3:15060

[prihlaseni]
type=auth
auth_type=userpass
username=8101
password=@HESLO@

[cil]
type=aor
contact=sip:8202@127.0.0.3:15060

[volajici]
type=endpoint
transport=linka-a
from_user=8101
callerid=Klapka TEST <8101>
aors=cil
outbound_auth=prihlaseni
disallow=all
allow=ulaw
direct_media=no
media_address=127.0.0.2
bind_rtp_to_media_address=yes

[prijem]
type=endpoint
transport=linka-b
auth=prihlaseni
context=volany
disallow=all
allow=ulaw
direct_media=no
media_address=127.0.0.3
bind_rtp_to_media_address=yes

[identita-volajiciho]
type=identify
endpoint=prijem
match=127.0.0.2/32
