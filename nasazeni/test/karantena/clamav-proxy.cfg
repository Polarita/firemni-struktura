global
    maxconn 8

defaults
    mode tcp
    timeout connect 10s
    timeout client 120s
    timeout server 120s

resolvers system_dns
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 3s
    timeout retry 1s
    hold valid 60s

frontend podpisy
    bind 10.239.31.1:443
    tcp-request connection reject unless { src 10.239.31.13 }
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 } { req.ssl_sni -i database.clamav.net }
    tcp-request content reject if { req.ssl_hello_type 1 } or WAIT_END
    default_backend distribuce

backend distribuce
    server podpisy database.clamav.net:443 resolvers system_dns resolve-prefer ipv4 init-addr libc,none
