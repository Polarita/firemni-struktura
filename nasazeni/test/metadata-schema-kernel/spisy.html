<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spisy | Ředitelství Polarity</title>
<style>body{font:1.05rem/1.55 system-ui,sans-serif;color:#172125;max-width:42rem;margin:3rem auto;padding:0 1rem}input,button{font:inherit;padding:.5rem}button{cursor:pointer}label{display:block}section{margin:2rem 0}dt{font-weight:600}dd{margin:0 0 .8rem}output{display:block;margin:1rem 0}.lhuta{display:inline-block;padding:.05rem .55rem;border-radius:.3rem;font-weight:600}.ve-lhute{background:#ccebd8;color:#12492b}.blizi-se{background:#ffe8a4;color:#593800}.po-lhute{background:#f7cecd;color:#6f1917}#terminy li{margin:.6rem 0}select{font:inherit;max-width:100%}details form{display:grid;gap:.4rem}details summary{cursor:pointer}</style>
<main><a href="/prehled">Ředitelství</a><h1>Spisy</h1>
<section><h2>Nový testovací spis</h2><p>Pobočka 101 · Praha</p><button id="zaloz" type="button">Založit spis</button></section>
<section><h2>Vyhledat spis</h2><form id="hledani"><label for="cislo">Číslo spisu nebo pobočkový alias</label><input id="cislo" required><button>Vyhledat</button></form></section>
<output role="status" id="stav"></output><section id="karta" hidden><h2 id="oznaceni"></h2><dl><dt>Pobočkový alias</dt><dd id="alias"></dd><dt>Pobočka</dt><dd id="pobocka"></dd><dt>Založeno</dt><dd id="cas"></dd></dl><h3>Převzetí šanonů do 48 hodin</h3>
<form id="sanony"><label for="sken">Sken ve formátu PDF (nejvýše 64 MiB)</label><input type="file" id="sken" accept="application/pdf,.pdf" required><button id="odeslat">Předat do karantény</button></form>
<p id="prijem" role="status"></p><h4>Poslední potvrzení o převzetí</h4><ul id="prevzate"></ul>
<h3>Digitální kniha objektu</h3>
<ul id="terminy"></ul><details id="zapis-revize" hidden><summary>Zapsat termín podle revizní zprávy</summary>
<form id="kniha"><label for="doklad">Archivovaný doklad</label><select id="doklad" name="priloha" required></select>
<label for="objekt">Označení objektu</label><input id="objekt" name="objekt" pattern="[A-Z0-9][A-Z0-9_\-]{0,47}" required>
<label for="zarizeni">Označení zařízení</label><input id="zarizeni" name="zarizeni" pattern="[A-Z0-9][A-Z0-9_\-]{0,47}" required>
<label for="revize">Revize provedena</label><input type="date" id="revize" name="revize" required>
<label for="upozornit">Připomenout od</label><input type="date" id="upozornit" name="upozornit" required>
<label for="platnost">Platnost do včetně</label><input type="date" id="platnost" name="platnost" required>
<button>Zapsat zkontrolované údaje</button></form></details><p id="stav-knihy" role="status"></p></section></main>
<script src="spisy.js" defer></script></html>
