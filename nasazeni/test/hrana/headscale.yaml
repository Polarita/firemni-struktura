server_url: https://vpn.polarita.test:8443
listen_addr: 10.239.31.11:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
trusted_proxies: ["10.239.31.10/32"]
noise:
  private_key_path: /var/lib/headscale/noise.key
prefixes:
  v4: 100.119.0.0/24
  v6: fd7a:115c:a1e0:706f::/64
derp:
  server:
    enabled: true
    region_id: 999
    region_code: polarita
    region_name: Polarita TEST
    verify_clients: true
    stun_listen_addr: 10.239.31.11:3478
    private_key_path: /var/lib/headscale/derp.key
    automatically_add_embedded_derp_region: false
  urls: []
  paths: [/etc/headscale/derp.yaml]
  auto_update_enabled: false
disable_check_updates: true
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
policy:
  mode: file
  path: /etc/headscale/policy.hujson
dns:
  magic_dns: true
  base_domain: int.polarita.test
  override_local_dns: false
  nameservers:
    global: []
unix_socket: /var/lib/headscale/headscale.sock
unix_socket_permission: "0600"
logtail:
  enabled: false
