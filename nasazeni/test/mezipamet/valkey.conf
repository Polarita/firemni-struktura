bind 127.0.0.1 10.239.33.13
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/secrets/valkey-cert
tls-key-file /run/secrets/valkey-klic
tls-ca-cert-file /run/secrets/valkey-cert
tls-auth-clients no
tls-protocols "TLSv1.3"
aclfile /run/secrets/valkey-acl
maxmemory 32mb
maxmemory-policy noeviction
maxclients 48
save ""
appendonly yes
appendfsync everysec
dir /data
loglevel notice
