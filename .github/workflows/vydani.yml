name: Vydání Polarity
on:
  push:
    tags: ['Polarita-*']
permissions:
  contents: write
jobs:
  sestaveni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ověřit zdroje a sestavit tiskové dokumenty
        env:
          POLARITA_PDF_BROWSER: /usr/bin/google-chrome
          POLARITA_REQUIRE_BROWSER: "1"
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$(python -c 'import json; print(json.load(open("nastroje/kanon.json"))["release_tag"])')"
          python -m venv "$RUNNER_TEMP/pdf-env"
          source "$RUNNER_TEMP/pdf-env/bin/activate"
          pip install -r nastroje/requirements.txt -r balicky/S1-generator-cistopisu/requirements.txt
          pip install pytest==9.2.0 pytest-cov==7.1.0 coverage==7.17.5
          export COVERAGE_FILE="$RUNNER_TEMP/polarita.coverage"
          python -m pytest -q --cov=vykop --cov-branch --cov-fail-under=100 nasazeni/test/inzenyring/test_vykop.py
          pip install openpyxl==3.1.5 lxml==6.1.3 defusedxml==0.7.1 et-xmlfile==2.0.0
          export POLARITA_XC4_SCHEMA="$RUNNER_TEMP/NZ.xsd"
          curl --retry 3 -fsSL --proto '=https' --proto-redir '=https' https://www.xc4.cz/download/NZ.xsd -o "$POLARITA_XC4_SCHEMA"
          echo "43151f01c79707fc02e62fc2f02ff4bd7e73b407886777706b25d2fdfe664c1d  $POLARITA_XC4_SCHEMA" | sha256sum -c
          python -m pytest -q nasazeni/test/inzenyring/rozpocet/test_rozpocet.py
          bash nasazeni/test/zkouska-prubehu.sh
          for suite in nastroje balicky/S1-generator-cistopisu balicky/S2-eval-suite balicky/S3-konfigurator-a-tarify; do
            python -m unittest discover -s "$suite"
          done
          python nastroje/check_consistency.py
          python nastroje/sync_prompt_core.py --check
          python nastroje/build_org_pdfs.py
          python nastroje/build_software_pdfs.py
          python balicky/S1-generator-cistopisu/generate_pdfs.py --output-dir "$RUNNER_TEMP/s1"
          python balicky/S3-konfigurator-a-tarify/pricing.py --build
          mkdir release-assets
          cp ./*.pdf "$RUNNER_TEMP"/s1/*.pdf balicky/S3-konfigurator-a-tarify/konfigurator.html release-assets/
          zip -j release-assets/manifesty-S1.zip "$RUNNER_TEMP"/s1/*.manifest.json
          cd release-assets
          sha256sum *.pdf *.zip *.html > SHA256SUMS
      - name: Zveřejnit ověřené přílohy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes release-assets/*
